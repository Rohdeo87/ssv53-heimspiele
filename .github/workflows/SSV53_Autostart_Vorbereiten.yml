name: "Einmalig: kontrollierten Neustart vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssv53-autostart-preparation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_PATH: .github/workflows/mower-decision.yml
      SELF_PATH: .github/workflows/SSV53_Autostart_Vorbereiten.yml

    steps:
      - name: Wartungstoken prüfen
        shell: bash
        env:
          TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || {
            echo "SSV53_AUTOMATION_TOKEN fehlt." >&2
            exit 1
          }

      - name: main laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}

      - name: Finale Mähsteuerung schreiben
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          encoded = ""
          target = Path(".github/workflows/mower-decision.yml")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(base64.b64decode(encoded))
          print(f"Aktualisiert: {target}")
          PY

      - name: Zielworkflow prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "PyYAML==6.0.2"

          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          path = Path(".github/workflows/mower-decision.yml")
          text = path.read_text(encoding="utf-8")
          parsed = yaml.safe_load(text)
          on_key = "on" if "on" in parsed else True

          assert parsed["name"] == "SSV53 Mähsteuerung"
          assert parsed[on_key]["schedule"][0]["cron"] == "*/5 * * * *"
          inputs = parsed[on_key]["workflow_dispatch"]["inputs"]
          assert inputs["execute_start"]["default"] is False
          assert inputs["simulate_owned_park"]["default"] is False
          assert "AUTOMATION_EXTERNAL_REASON = 253053" in text
          assert '"type": "Park"' in text
          assert '"type": "StartInWorkArea"' in text
          assert "MOWER_AUTOSTART_ENABLED" in text
          assert "/calendar" not in text
          assert "/settings" not in text
          assert "ResumeSchedule" not in text

          match = re.search(
              r"python - <<'PY'\n(.*?)\n          PY",
              text,
              flags=re.S,
          )
          assert match, "Eingebetteter Python-Code fehlt."
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in match.group(1).splitlines()
          )
          compile(code, "mower_controller.py", "exec")
          assert code.count('method="POST"') == 2
          PY

      - name: Einmal-Aktualisierer entfernen und speichern
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$SELF_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_PATH" "$SELF_PATH"

          if git diff --cached --quiet; then
            echo "Der Zielworkflow ist bereits aktuell."
          else
            git commit -m "Kontrollierten Neustart im Dry Run vorbereiten"
            git push origin HEAD:main
          fi

      - name: Zusammenfassung
        if: always()
        shell: bash
        run: |
          {
            echo "## Kontrollierter Neustart"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Die Neustartlogik wurde vorbereitet."
              echo ""
              echo "- Live-Parken bleibt aktiv."
              echo "- Autostart bleibt standardmäßig deaktiviert."
              echo "- Eigene Parkierungen erhalten später die Kennung 253053."
              echo "- Ein Start ist nur nach genau dieser Kennung zulässig."
              echo "- Eine gefahrlose Simulation ist im normalen Workflow verfügbar."
              echo "- Der Einmal-Aktualisierer wurde wieder entfernt."
            else
              echo "❌ Aktualisierung fehlgeschlagen; main wurde nicht verändert."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
