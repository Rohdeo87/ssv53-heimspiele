name: "Einmalig: Azure-Migration Phase 3 Sicherheitszustand vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Zustands- und Doppelausführungsschutz einbauen
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Phase 3 im Migrationsbranch installieren und testen
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="feature/azure-mower-migration"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Der erwartete Migrationsbranch $BRANCH fehlt." >&2
            exit 1
          fi

          git switch "$BRANCH"
          git pull --ff-only origin "$BRANCH"

          python - <<'PYFILES'
          from __future__ import annotations

          import base64
          from pathlib import Path

          files = {
              'mower/state.py': '',
              'mower/state_store.py': '',
              'mower/safety.py': '',
              'tests/test_mower_state.py': '',
          }

          for relative_path, encoded_content in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded_content))
              print(f"Erzeugt/aktualisiert: {target}")

          documentation = Path("AZURE_MIGRATION.md")
          phase_marker = "## Phase 3 – Sicherheitszustand und Doppelausführungsschutz"
          addition = base64.b64decode('').decode('utf-8')
          current = documentation.read_text(encoding="utf-8") if documentation.exists() else "# SSV53 Azure-Migration\n"
          if phase_marker not in current:
              documentation.write_text(current.rstrip() + "\n" + addition, encoding="utf-8")
              print("AZURE_MIGRATION.md um Phase 3 ergänzt.")
          else:
              print("Phase-3-Dokumentation ist bereits vorhanden.")
          PYFILES

          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m compileall -q mower function_app.py
          python -m unittest discover -s tests -p "test_*.py" -v

          python - <<'PYSAFE'
          from pathlib import Path

          checked = [
              Path("mower/state.py"),
              Path("mower/state_store.py"),
              Path("mower/safety.py"),
          ]
          combined = "\n".join(path.read_text(encoding="utf-8") for path in checked)

          forbidden = (
              "/actions",
              "send_mower_action",
              "urlopen(",
              "HYDRAWISE_API_KEY",
              "HUSQVARNA_CLIENT_SECRET",
          )
          found = [value for value in forbidden if value in combined]
          if found:
              raise SystemExit(
                  "Sicherheitsprüfung fehlgeschlagen. Unerwartete externe "
                  f"Steuerlogik gefunden: {found}"
              )

          required = (
              "DUPLICATE_COMMAND",
              "START_NOT_OWNED",
              "MAINTENANCE_MODE",
              "StateConflictError",
              "expected_revision",
          )
          missing = [value for value in required if value not in combined]
          if missing:
              raise SystemExit(
                  "Sicherheitsprüfung fehlgeschlagen. Schutzmechanismen fehlen: "
                  f"{missing}"
              )

          controller = Path("mower/controller.py").read_text(encoding="utf-8")
          if "ensure_heartbeat_only_mode" not in controller:
              raise SystemExit(
                  "Die Sperre für echte Betriebsarten ist nicht mehr vorhanden."
              )

          print("Alle statischen Phase-3-Sicherheitsprüfungen bestanden.")
          PYSAFE

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add \
            mower/state.py \
            mower/state_store.py \
            mower/safety.py \
            tests/test_mower_state.py \
            AZURE_MIGRATION.md

          if git diff --cached --quiet; then
            echo "Phase 3 war bereits vollständig vorhanden."
          else
            git commit -m "Azure Phase 3 Sicherheitszustand und Doppelausführungsschutz"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Einmaligen Installer aus main entfernen
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          INSTALLER=".github/workflows/SSV53_Azure_Migration_Phase3_Sicherheitszustand.yml"

          git switch main
          git pull --ff-only origin main
          rm -f "$INSTALLER"

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -A "$INSTALLER"
          if git diff --cached --quiet; then
            echo "Installer war bereits entfernt."
          else
            git commit -m "Einmaligen Azure-Phase-3-Installer entfernen"
            git push origin HEAD:main
          fi

      - name: Ergebnis zusammenfassen
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "# Azure-Migration Phase 3 vorbereitet"
            echo
            echo "- Branch: \`feature/azure-mower-migration\`"
            echo "- Versionierter Automationszustand ergänzt"
            echo "- Optimistischer Revisionsschutz gegen parallele Schreibvorgänge ergänzt"
            echo "- Identische Befehle werden über einen Fingerabdruck erkannt"
            echo "- Automatischer Start ohne eigene Parkierung wird blockiert"
            echo "- Wartungsmodus und Heartbeat-Alter werden auswertbar"
            echo "- Alle Repository- und Sicherheitstests erfolgreich"
            echo "- Keine externen API-Aufrufe oder Gerätebefehle ergänzt"
          } >> "$GITHUB_STEP_SUMMARY"
