name: "Einmalig: Azure-Migration Phase 6 Quellpaket vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Geprüftes Azure-Quellpaket vorbereiten
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Phase 6 im Migrationsbranch installieren und prüfen
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="feature/azure-mower-migration"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Der erwartete Migrationsbranch $BRANCH fehlt." >&2
            exit 1
          fi

          git switch "$BRANCH"
          git pull --ff-only origin "$BRANCH"

          python - <<'PYFILES'
          from __future__ import annotations

          import base64
          from pathlib import Path

          files = {'scripts/build_azure_source_package.py': '', '.github/workflows/azure-package-build.yml': '', 'tests/test_azure_package.py': ''}
          for relative_path, encoded_content in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded_content))
              print(f"Erzeugt/aktualisiert: {target}")

          documentation = Path("AZURE_MIGRATION.md")
          current = documentation.read_text(encoding="utf-8")
          addition = base64.b64decode('').decode("utf-8")
          if "## Phase 6 – geprüftes Azure-Function-Quellpaket" not in current:
              documentation.write_text(
                  current.rstrip() + "\n" + addition,
                  encoding="utf-8",
              )
              print("AZURE_MIGRATION.md um Phase 6 ergänzt.")
          else:
              print("Phase-6-Dokumentation ist bereits vorhanden.")
          PYFILES

          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m compileall -q mower function_app.py scripts
          python -m unittest discover -s tests -p "test_*.py" -v

          rm -rf dist
          python scripts/build_azure_source_package.py             --output dist/ssv53-platzpflege-source.zip             | tee dist/package-result.json

          python - <<'PYSAFE'
          import json
          import zipfile
          from pathlib import Path

          package = Path("dist/ssv53-platzpflege-source.zip")
          if not package.is_file() or package.stat().st_size == 0:
              raise SystemExit("Das erwartete Azure-Quellpaket wurde nicht erzeugt.")

          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              if "host.json" not in names or "function_app.py" not in names:
                  raise SystemExit(
                      "host.json oder function_app.py liegt nicht im ZIP-Wurzelverzeichnis."
                  )
              manifest = json.loads(
                  archive.read("package-manifest.json").decode("utf-8")
              )
              if manifest.get("safety_stage") != "DRY_RUN_READ_ONLY":
                  raise SystemExit("Unsichere Paketstufe entdeckt.")

          workflow = Path(
              ".github/workflows/azure-package-build.yml"
          ).read_text(encoding="utf-8")
          forbidden = (
              "azure/login",
              "az deployment group create",
              "func azure functionapp publish",
              "azure/functions-action",
          )
          found = [value for value in forbidden if value in workflow]
          if found:
              raise SystemExit(
                  f"Unerwartete Deploymentlogik im Paketworkflow: {found}"
              )

          print("Phase 6 ist sicher, read-only und bereitstellungsfrei.")
          PYSAFE

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add             scripts/build_azure_source_package.py             .github/workflows/azure-package-build.yml             tests/test_azure_package.py             AZURE_MIGRATION.md

          if git diff --cached --quiet; then
            echo "Phase 6 war bereits vollständig vorhanden."
          else
            git commit -m "Azure Phase 6 Quellpaket vorbereiten"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Einmaligen Installer aus main entfernen
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          INSTALLER=".github/workflows/SSV53_Azure_Migration_Phase6_Quellpaket.yml"

          git switch main
          git pull --ff-only origin main
          rm -f "$INSTALLER"

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -A "$INSTALLER"
          if git diff --cached --quiet; then
            echo "Installer war bereits entfernt."
          else
            git commit -m "Einmaligen Azure-Phase-6-Installer entfernen"
            git push origin HEAD:main
          fi

      - name: Ergebnis zusammenfassen
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "# Azure-Migration Phase 6 vorbereitet"
            echo
            echo "- Branch: \`feature/azure-mower-migration\`"
            echo "- Geprüfter Azure-Functions-Quellpaket-Builder installiert"
            echo "- Paketstufe: **DRY_RUN_READ_ONLY**"
            echo "- Keine Azure-Anmeldung und kein Deployment"
            echo "- Keine Mäher- oder Beregnungsbefehle im Paket"
            echo "- Neuer Paketworkflow erzeugt nur ein GitHub-Artefakt"
          } >> "$GITHUB_STEP_SUMMARY"
