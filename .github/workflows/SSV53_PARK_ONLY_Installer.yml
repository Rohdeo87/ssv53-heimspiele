name: Einmalig - PARK_ONLY Stufe vorbereiten

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssv53-park-only-installer
  cancel-in-progress: false

jobs:
  install:
    name: PARK_ONLY Code sicher installieren und testen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Azure-Migrationsbranch laden
        uses: actions/checkout@v7
        with:
          ref: feature/azure-mower-migration
          fetch-depth: 0

      - name: PARK_ONLY Änderungspaket anwenden
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          code = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code, "park-only-installer", "exec"), {"__name__": "__main__"})
          PY

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Gesamte Testsuite und Paketbau prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q mower function_app.py scripts
          python -m unittest discover -s tests -p "test_*.py" -v
          rm -rf dist
          mkdir -p dist
          python scripts/build_azure_source_package.py --output dist/ssv53-platzpflege-source.zip

      - name: Sicherheitsgrenzen des Kandidaten hart prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ParkUntilFurtherNotice' mower/husqvarna.py
          grep -Fq 'ENABLE_PARK_COMMANDS' mower/runtime.py
          grep -Fq 'class AzureTableStateStore' mower/state_store.py
          grep -Fq 'PARK_ONLY_CAPABLE_LOCKED' scripts/build_azure_source_package.py
          if grep -R --line-number -E 'ResumeSchedule|StartInWorkArea|def start_' mower; then
            echo "Verbotene Startfunktion im produktiven Mähercode gefunden." >&2
            exit 1
          fi

      - name: Änderungen auf Azure-Migrationsbranch committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Keine Änderungen notwendig; PARK_ONLY-Stufe ist bereits installiert."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add requirements.txt mower scripts tests .github/workflows/azure-package-build.yml
            git commit -m "PARK_ONLY Stufe sicher vorbereiten"
            git push origin HEAD:feature/azure-mower-migration
          fi

      - name: Ergebnis zusammenfassen
        shell: bash
        run: |
          {
            echo "# PARK_ONLY Kandidat vorbereitet"
            echo
            echo "- Echter Husqvarna-Parkbefehl: **im Code vorhanden**"
            echo "- Automatischer Start: **nicht implementiert**"
            echo "- Aktivierung: **noch NICHT erfolgt**"
            echo "- Doppelgate: **CONTROL_MODE=PARK_ONLY + ENABLE_PARK_COMMANDS=true**"
            echo "- Azure Table State / Dedupe: **integriert**"
            echo "- Fehlerzustände: **fail-closed**"
            echo "- Azure geändert: **nein**"
            echo "- Mäher angesprochen: **nein**"
          } >> "$GITHUB_STEP_SUMMARY"
