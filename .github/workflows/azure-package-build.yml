name: Azure-Function Quellpaket bauen

on:
  workflow_dispatch:
  push:
    branches:
      - feature/azure-mower-migration
    paths:
      - "function_app.py"
      - "host.json"
      - "requirements.txt"
      - "mower/**"
      - "occupancy/**"
      - "public/rasen.ics"
      - "public/kunstrasen.ics"
      - "public/matches.json"
      - "scripts/build_azure_source_package.py"
      - "tests/test_azure_package.py"
      - ".github/workflows/azure-package-build.yml"
  pull_request:
    paths:
      - "function_app.py"
      - "host.json"
      - "requirements.txt"
      - "mower/**"
      - "occupancy/**"
      - "public/rasen.ics"
      - "public/kunstrasen.ics"
      - "public/matches.json"
      - "scripts/build_azure_source_package.py"
      - "tests/test_azure_package.py"
      - ".github/workflows/azure-package-build.yml"

permissions:
  contents: read

concurrency:
  group: azure-package-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Sicheres Azure-Quellpaket prüfen und erzeugen
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Repository- und Sicherheitstests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q mower function_app.py scripts
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Geprüftes Quellpaket bauen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          python scripts/build_azure_source_package.py \
            --output dist/ssv53-platzpflege-source.zip \
            | tee dist/package-result.json

      - name: Paketstruktur und Sicherheitsgrenzen prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          package = Path("dist/ssv53-platzpflege-source.zip")
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              required = {
                  "host.json",
                  "function_app.py",
                  "requirements.txt",
                  "package-manifest.json",
                  "mower/controller.py",
                  "mower/husqvarna.py",
                  "occupancy/match_model.py",
                  "occupancy/runtime_source.py",
                  "occupancy/service.py",
                  "public/rasen.ics",
                  "public/kunstrasen.ics",
                  "public/matches.json",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"Erforderliche Paketeinträge fehlen: {missing}")

              forbidden_prefixes = (
                  ".git/",
                  ".github/",
                  "tests/",
                  "infra/",
                  "generated/",
              )
              forbidden = sorted(
                  name
                  for name in names
                  if name.startswith(forbidden_prefixes)
              )
              if forbidden:
                  raise SystemExit(
                      f"Unerwartete Dateien im Quellpaket: {forbidden}"
                  )

              manifest = json.loads(
                  archive.read("package-manifest.json").decode("utf-8")
              )
              if manifest.get("safety_stage") != "DRY_RUN_READ_ONLY":
                  raise SystemExit("Unsichere oder unbekannte Paketstufe.")
              if manifest.get("remote_build_required") is not True:
                  raise SystemExit("Remote-Build-Hinweis fehlt.")

          print("Azure-Quellpaket ist strukturell und fachlich sicher.")
          PY

      - name: Prüfpaket als GitHub-Artefakt speichern
        uses: actions/upload-artifact@v7
        with:
          name: ssv53-azure-function-source-${{ github.run_number }}
          path: |
            dist/ssv53-platzpflege-source.zip
            dist/package-result.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Ergebnis zusammenfassen
        shell: bash
        run: |
          {
            echo "# Azure-Function Quellpaket"
            echo
            echo "- Tests: **erfolgreich**"
            echo "- Sicherheitsstufe: **DRY_RUN_READ_ONLY**"
            echo "- Gerätebefehle im Paket: **keine**"
            echo "- Azure-Übertragung: **keine**"
            echo "- Remote Build bei späterer Bereitstellung erforderlich: **ja**"
            echo "- Artefaktaufbewahrung: **14 Tage**"
          } >> "$GITHUB_STEP_SUMMARY"
