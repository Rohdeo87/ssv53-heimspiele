name: SSV53 Sonderbelegung Recovery V2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Exakt SSV53-SPECIAL-OCCUPANCY-RECOVER eingeben"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ssv53-special-occupancy-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Sonderbelegung prüfen und fertigstellen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MIGRATION_BRANCH: feature/azure-mower-migration
      RESOURCE_GROUP: rg-ssv53-platzpflege-prod
      FUNCTION_APP: func-ssv53platzpflege-prod-q7kbw54s
      ADMIN_FUNCTION: ssv53_occupancy_admin
      ADMIN_KEY_NAME: ssv53-occupancy-command
      ALLOWED_SENDER: thomas_rohde@outlook.de

    steps:
      - name: Nur bestätigten Lauf auf Migrationsbranch zulassen
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          [ "$GITHUB_REF_NAME" = "$MIGRATION_BRANCH" ] || {
            echo "Recovery darf nur vom Branch $MIGRATION_BRANCH gestartet werden." >&2
            exit 1
          }

          [ "$CONFIRMATION" = "SSV53-SPECIAL-OCCUPANCY-RECOVER" ] || {
            echo "Bestätigung ist falsch." >&2
            exit 1
          }

      - name: Per OIDC mit Azure anmelden
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Laufende Azure-Konfiguration und Identity prüfen
        shell: bash
        run: |
          set -euo pipefail

          az functionapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --output json \
            > /tmp/appsettings-before.json

          python - <<'PY' > /tmp/runtime-store.env
          import json
          import urllib.parse

          rows = json.load(open("/tmp/appsettings-before.json", encoding="utf-8"))
          values = {str(row["name"]): str(row.get("value", "")) for row in rows}

          storage_url = values.get("SSV53_STORAGE_ACCOUNT_URL", "").strip()
          table_name = values.get("SSV53_STATE_TABLE_NAME", "").strip()
          client_id = (
              values.get("SSV53_STATE_MANAGED_IDENTITY_CLIENT_ID", "").strip()
              or values.get("AzureWebJobsStorage__clientId", "").strip()
          )

          if not storage_url or not table_name or not client_id:
              raise SystemExit(
                  "Azure-Table-Konfiguration unvollständig: "
                  f"url={bool(storage_url)} table={bool(table_name)} clientId={bool(client_id)}"
              )

          host = urllib.parse.urlparse(storage_url).hostname or ""
          storage_account = host.split(".", 1)[0]
          if not storage_account:
              raise SystemExit("Storage-Account konnte aus SSV53_STORAGE_ACCOUNT_URL nicht bestimmt werden.")

          print(f"STORAGE_ACCOUNT={storage_account}")
          print(f"TABLE_NAME={table_name}")
          print(f"STATE_CLIENT_ID={client_id}")
          PY

          set -a
          source /tmp/runtime-store.env
          set +a

          IDENTITY_JSON="$(
            az identity list \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?clientId=='$STATE_CLIENT_ID'] | [0]" \
              --output json
          )"

          PRINCIPAL_ID="$(
            python - "$IDENTITY_JSON" <<'PY'
          import json
          import sys
          value = json.loads(sys.argv[1])
          print(value.get("principalId", "") if isinstance(value, dict) else "")
          PY
          )"

          IDENTITY_ID="$(
            python - "$IDENTITY_JSON" <<'PY'
          import json
          import sys
          value = json.loads(sys.argv[1])
          print(value.get("id", "") if isinstance(value, dict) else "")
          PY
          )"

          [ -n "$PRINCIPAL_ID" ] && [ -n "$IDENTITY_ID" ] || {
            echo "Die konfigurierte User Assigned Managed Identity wurde in der Resource Group nicht gefunden." >&2
            exit 1
          }

          APP_IDENTITIES="$(
            az functionapp identity show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --query userAssignedIdentities \
              --output json
          )"

          export APP_IDENTITIES STATE_CLIENT_ID
          python - <<'PY'
          import json
          import os

          identities = json.loads(os.environ["APP_IDENTITIES"] or "{}")
          expected = os.environ["STATE_CLIENT_ID"].lower()
          attached = any(
              str(value.get("clientId", "")).lower() == expected
              for value in identities.values()
              if isinstance(value, dict)
          )
          if not attached:
              raise SystemExit(
                  "Die für Azure Table konfigurierte Managed Identity ist nicht an der Function App angehängt."
              )
          print("Managed Identity ist korrekt an der Function App angehängt.")
          PY

          STORAGE_ID="$(
            az storage account show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$STORAGE_ACCOUNT" \
              --query id \
              --output tsv
          )"
          [ -n "$STORAGE_ID" ]

          ROLE_COUNT="$(
            az role assignment list \
              --assignee-object-id "$PRINCIPAL_ID" \
              --scope "$STORAGE_ID" \
              --include-inherited \
              --query "[?roleDefinitionName=='Storage Table Data Contributor'] | length(@)" \
              --output tsv
          )"

          echo "Storage Table Data Contributor assignments: ${ROLE_COUNT:-0}"

          if [ "${ROLE_COUNT:-0}" = "0" ]; then
            echo "Die vorgesehene Table-Rolle fehlt. Sie wird jetzt entsprechend der bestehenden Bicep-Definition nachgezogen."
            az role assignment create \
              --assignee-object-id "$PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "Storage Table Data Contributor" \
              --scope "$STORAGE_ID" \
              --output none
            echo "Rolle angelegt; kurze Propagationspause."
            sleep 45
          fi

          {
            echo "STORAGE_ACCOUNT=$STORAGE_ACCOUNT"
            echo "TABLE_NAME=$TABLE_NAME"
            echo "STATE_CLIENT_ID=$STATE_CLIENT_ID"
            echo "PRINCIPAL_ID=$PRINCIPAL_ID"
            echo "STORAGE_ID=$STORAGE_ID"
          } > /tmp/runtime-store-final.env

      - name: Admin-Endpunkt und dedizierten Function-Key prüfen
        shell: bash
        run: |
          set -euo pipefail

          az functionapp function show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --function-name "$ADMIN_FUNCTION" \
            --output none

          KEYS_JSON="$(
            az functionapp function keys list \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --function-name "$ADMIN_FUNCTION" \
              --output json
          )"
          export KEYS_JSON

          FUNCTION_KEY="$(
            python - <<'PY'
          import json
          import os
          values = json.loads(os.environ["KEYS_JSON"])
          print(values.get("ssv53-occupancy-command", ""))
          PY
          )"

          if [ -z "$FUNCTION_KEY" ]; then
            FUNCTION_KEY="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )"
            az functionapp function keys set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --function-name "$ADMIN_FUNCTION" \
              --key-name "$ADMIN_KEY_NAME" \
              --key-value "$FUNCTION_KEY" \
              --output none
          fi

          echo "::add-mask::$FUNCTION_KEY"
          printf '%s' "$FUNCTION_KEY" > /tmp/occupancy-function-key
          chmod 600 /tmp/occupancy-function-key

      - name: Sonderbelegungen mit sichtbarer HTTP-Diagnose schreiben
        shell: bash
        run: |
          set -euo pipefail

          HOST="$(
            az functionapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --query defaultHostName \
              --output tsv
          )"
          [ -n "$HOST" ]
          FUNCTION_KEY="$(cat /tmp/occupancy-function-key)"

          python - <<'PY'
          import json

          commands = [
              {
                  "commandId": "migration-herbstkino-2026-10-03-v1",
                  "action": "upsert",
                  "event": {
                      "id": "sperre-herbstkino-2026-10-03",
                      "title": "Herbstkino – Kunstrasen gesperrt",
                      "start": "2026-10-03T00:00:00+02:00",
                      "end": "2026-10-04T00:00:00+02:00",
                      "resourceId": "kunstrasen",
                      "area": "vorne & hinten",
                      "description": "Kunstrasen ganztägig wegen Herbstkino gesperrt.",
                      "suppressTraining": True,
                      "mowerBufferBeforeMinutes": 30,
                      "mowerBufferAfterMinutes": 30,
                  },
              },
              {
                  "commandId": "migration-weihnachtssingen-2026-12-18-v1",
                  "action": "upsert",
                  "event": {
                      "id": "sperre-weihnachtssingen-2026-12-18",
                      "title": "Weihnachtssingen – Kunstrasen gesperrt",
                      "start": "2026-12-18T00:00:00+01:00",
                      "end": "2026-12-19T00:00:00+01:00",
                      "resourceId": "kunstrasen",
                      "area": "vorne & hinten",
                      "description": "Kunstrasen ganztägig wegen Weihnachtssingen gesperrt.",
                      "suppressTraining": True,
                      "mowerBufferBeforeMinutes": 30,
                      "mowerBufferAfterMinutes": 30,
                  },
              },
          ]

          for index, command in enumerate(commands, start=1):
              with open(f"/tmp/special-command-{index}.json", "w", encoding="utf-8") as handle:
                  json.dump(command, handle, ensure_ascii=False)
          PY

          post_command() {
            local file="$1"
            local response="${file}.response"
            local code

            code="$(
              curl \
                --silent \
                --show-error \
                --request POST \
                --header "Content-Type: application/json" \
                --header "x-functions-key: $FUNCTION_KEY" \
                --data @"$file" \
                --output "$response" \
                --write-out "%{http_code}" \
                "https://${HOST}/api/occupancy-admin" \
                || true
            )"

            echo "HTTP-Status für $(basename "$file"): $code"
            echo "Antwort:"
            python - "$response" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8", errors="replace") if path.exists() else ""
          try:
              print(json.dumps(json.loads(text), ensure_ascii=False, indent=2, sort_keys=True))
          except Exception:
              print(text or "<leer>")
          PY

            if [[ ! "$code" =~ ^2 ]]; then
              echo "occupancy-admin hat den Schreibauftrag abgelehnt." >&2
              return 1
            fi

            python - "$response" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload.get("ok") is True, payload
          print("Gespeichert:", payload.get("event", {}).get("title"))
          PY
          }

          if ! post_command /tmp/special-command-1.json; then
            echo "Erster Write fehlgeschlagen. Best-effort Application-Insights-Diagnose folgt."
            APP_NAME="$(
              az resource list \
                --resource-group "$RESOURCE_GROUP" \
                --resource-type "Microsoft.Insights/components" \
                --query "[0].name" \
                --output tsv 2>/dev/null || true
            )"

            if [ -n "$APP_NAME" ]; then
              az extension add --name application-insights --upgrade --yes >/dev/null 2>&1 || true
              APP_ID="$(
                az monitor app-insights component show \
                  --app "$APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query appId \
                  --output tsv 2>/dev/null || true
              )"
              if [ -n "$APP_ID" ]; then
                sleep 15
                echo "Letzte relevante Exceptions/Traces:"
                az monitor app-insights query \
                  --app "$APP_ID" \
                  --analytics-query "exceptions | where timestamp > ago(20m) | where outerMessage contains 'occupancy' or innermostMessage contains 'occupancy' or outerMessage contains 'Table' or innermostMessage contains 'Table' or outerMessage contains 'ManagedIdentity' or innermostMessage contains 'ManagedIdentity' | project timestamp, type, outerMessage, innermostMessage | order by timestamp desc | take 20" \
                  --output table 2>/dev/null || true
                az monitor app-insights query \
                  --app "$APP_ID" \
                  --analytics-query "traces | where timestamp > ago(20m) | where message contains 'SSV53_SPECIAL_OCCUPANCY' | project timestamp, severityLevel, message | order by timestamp desc | take 20" \
                  --output table 2>/dev/null || true
              fi
            fi
            exit 1
          fi

          post_command /tmp/special-command-2.json

      - name: Feature erst nach erfolgreichen Writes aktivieren
        shell: bash
        run: |
          set -euo pipefail

          az functionapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --settings \
              SSV53_SPECIAL_OCCUPANCY_ENABLED=true \
              SSV53_OCCUPANCY_COMMAND_ALLOWED_SENDER="$ALLOWED_SENDER" \
            --output none

      - name: Bestehende Appsettings schützen
        shell: bash
        run: |
          set -euo pipefail

          az functionapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --output json \
            > /tmp/appsettings-final.json

          python - <<'PY'
          import json

          def values(path):
              rows = json.load(open(path, encoding="utf-8"))
              return {
                  str(row["name"]): str(row.get("value", ""))
                  for row in rows
              }

          before = values("/tmp/appsettings-before.json")
          final = values("/tmp/appsettings-final.json")

          allowed = {
              "SSV53_SPECIAL_OCCUPANCY_ENABLED",
              "SSV53_OCCUPANCY_COMMAND_ALLOWED_SENDER",
          }
          changed = sorted(
              key for key in before
              if key not in allowed and before.get(key) != final.get(key)
          )
          removed = sorted(key for key in before if key not in final)

          if changed or removed:
              raise SystemExit(
                  "Unerwartete Änderung bestehender Appsettings: "
                  + ", ".join(sorted(set(changed + removed)))
              )

          assert final.get("SSV53_SPECIAL_OCCUPANCY_ENABLED", "").lower() == "true"
          assert final.get("SSV53_OCCUPANCY_COMMAND_ALLOWED_SENDER", "").lower() == "thomas_rohde@outlook.de"
          print("Bestehende Mäher-, Beregnungs- und Mail-Appsettings sind unverändert.")
          PY

      - name: Öffentliche Sonderbelegung live prüfen
        shell: bash
        run: |
          set -euo pipefail

          HOST="$(
            az functionapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --query defaultHostName \
              --output tsv
          )"

          fetch_live() {
            local url="$1"
            local output="$2"
            local ok=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "$url" > "$output"; then
                ok=true
                break
              fi
              sleep 5
            done
            [ "$ok" = "true" ]
          }

          fetch_live \
            "https://${HOST}/api/occupancy?start=2026-10-03&end=2026-10-04&season=Sommer" \
            /tmp/october.json

          fetch_live \
            "https://${HOST}/api/occupancy?start=2026-12-18&end=2026-12-19&season=Winter" \
            /tmp/december.json

          python - <<'PY'
          import json

          october = json.load(open("/tmp/october.json", encoding="utf-8"))
          december = json.load(open("/tmp/december.json", encoding="utf-8"))

          for payload in (october, december):
              special = payload.get("special_occupancy", {})
              assert special.get("enabled") is True, special
              assert special.get("available") is True, special
              assert special.get("fail_closed") is False, special
              assert special.get("count") == 1, special

          october_ids = [item.get("id") for item in october.get("events", [])]
          december_ids = [item.get("id") for item in december.get("events", [])]

          assert october_ids.count("one-off:sperre-herbstkino-2026-10-03") == 1
          assert december_ids.count("one-off:sperre-weihnachtssingen-2026-12-18") == 1

          december_training = [
              item for item in december.get("events", [])
              if item.get("source") == "training"
              and item.get("resourceId") == "kunstrasen"
              and str(item.get("start", "")).startswith("2026-12-18")
          ]
          assert not december_training, december_training

          print("LIVE OK: Beide Sonderbelegungen kommen aus Azure Table.")
          PY

      - name: Azure-Sitzung beenden
        if: always()
        run: az logout || true
