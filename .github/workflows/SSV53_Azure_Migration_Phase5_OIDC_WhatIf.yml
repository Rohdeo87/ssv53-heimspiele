name: "Einmalig: Azure-Migration Phase 5 OIDC What-if vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: OIDC-What-if sicher vorbereiten
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Phase 5 im Migrationsbranch installieren und prüfen
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="feature/azure-mower-migration"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Der erwartete Migrationsbranch $BRANCH fehlt." >&2
            exit 1
          fi

          git switch "$BRANCH"
          git pull --ff-only origin "$BRANCH"

          python - <<'PYFILES'
          from __future__ import annotations

          import base64
          from pathlib import Path

          files = {'.github/workflows/azure-infra-what-if.yml': '', 'infra/AZURE_OIDC_SETUP.md': '', 'tests/test_azure_what_if.py': ''}

          for relative_path, encoded_content in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded_content))
              print(f"Erzeugt/aktualisiert: {target}")

          validate_path = Path(".github/workflows/azure-infra-validate.yml")
          validate_text = validate_path.read_text(encoding="utf-8")
          validate_text = validate_text.replace(
              "uses: actions/checkout@v4",
              "uses: actions/checkout@v6",
          )
          validate_path.write_text(validate_text, encoding="utf-8")
          print("Azure-Validierungsworkflow auf checkout@v6 aktualisiert.")

          documentation = Path("AZURE_MIGRATION.md")
          current = documentation.read_text(encoding="utf-8")
          addition = base64.b64decode('').decode("utf-8")
          if "## Phase 5 – OIDC und Azure What-if" not in current:
              documentation.write_text(
                  current.rstrip() + "\n" + addition,
                  encoding="utf-8",
              )
              print("AZURE_MIGRATION.md um Phase 5 ergänzt.")
          else:
              print("Phase-5-Dokumentation ist bereits vorhanden.")
          PYFILES

          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m compileall -q mower function_app.py
          python -m unittest discover -s tests -p "test_*.py" -v

          python - <<'PYSAFE'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/azure-infra-what-if.yml"
          ).read_text(encoding="utf-8")
          validate = Path(
              ".github/workflows/azure-infra-validate.yml"
          ).read_text(encoding="utf-8")

          required = (
              "actions/checkout@v6",
              "azure/login@v3",
              "id-token: write",
              "az deployment group validate",
              "az deployment group what-if",
              "--validation-level ProviderNoRbac",
              'controlMode="DRY_RUN"',
              "enableLiveReads=false",
          )
          missing = [value for value in required if value not in workflow]
          if missing:
              raise SystemExit(f"Erwartete What-if-Sicherheitsmerkmale fehlen: {missing}")

          forbidden = (
              "az deployment group create",
              "azure/functions-action",
              "client-secret:",
              "ParkUntilFurtherNotice",
              "StartInWorkArea",
          )
          found = [value for value in forbidden if value in workflow]
          if found:
              raise SystemExit(f"Unerwartete Bereitstellungs- oder Gerätelogik: {found}")

          if "actions/checkout@v4" in validate:
              raise SystemExit("Die Node-20-basierte checkout-Version ist noch vorhanden.")

          print("OIDC-What-if und Node-24-Aktualisierung sind sicher vorbereitet.")
          PYSAFE

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add             .github/workflows/azure-infra-what-if.yml             .github/workflows/azure-infra-validate.yml             infra/AZURE_OIDC_SETUP.md             tests/test_azure_what_if.py             AZURE_MIGRATION.md

          if git diff --cached --quiet; then
            echo "Phase 5 war bereits vollständig vorhanden."
          else
            git commit -m "Azure Phase 5 OIDC What-if vorbereiten"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Einmaligen Installer aus main entfernen
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          INSTALLER=".github/workflows/SSV53_Azure_Migration_Phase5_OIDC_WhatIf.yml"

          git switch main
          git pull --ff-only origin main
          rm -f "$INSTALLER"

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -A "$INSTALLER"
          if git diff --cached --quiet; then
            echo "Installer war bereits entfernt."
          else
            git commit -m "Einmaligen Azure-Phase-5-Installer entfernen"
            git push origin HEAD:main
          fi

      - name: Ergebnis zusammenfassen
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "# Azure-Migration Phase 5 vorbereitet"
            echo
            echo "- Branch: \`feature/azure-mower-migration\`"
            echo "- Checkout auf Node-24-basierte Version 6 aktualisiert"
            echo "- Passwortlose Azure-Anmeldung per OIDC vorbereitet"
            echo "- Ausschließlich Validate und What-if vorgesehen"
            echo "- Kein Azure-Deploymentbefehl enthalten"
            echo "- Sichere feste Werte: DRY_RUN und Live-Abfragen deaktiviert"
            echo "- Noch keine Azure-Anmeldung und keine Azure-Ressourcen erstellt"
          } >> "$GITHUB_STEP_SUMMARY"
