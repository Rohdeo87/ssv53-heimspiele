name: "Einmalig: mobilen Spielabruf vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ssv53-mobile-bootstrap
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Test-Branch vorbereiten
        shell: bash
        env:
          BRANCH: feature/mobile-spielabruf-report-v1
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH existiert bereits. Der Installer überschreibt ihn nicht."
            exit 1
          fi
          git checkout -b "$BRANCH" origin/main

      - name: Fertig geprüfte Dateien einspielen
        shell: bash
        run: |
          python - <<'PYFILES'
          from pathlib import Path
          import base64

          files = {"report_changes.py":"","tests/test_change_report.py":"",".github/workflows/update-matches.yml":"",".github/workflows/pull-request-tests.yml":"","MOBILER_SPIELABRUF.md":""}
          for relative, payload in files.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(payload))
              print(f"geschrieben: {relative}")
          PYFILES

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Vollständige Tests ausführen
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q .

      - name: Änderungen committen und pushen
        shell: bash
        env:
          BRANCH: feature/mobile-spielabruf-report-v1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report_changes.py tests/test_change_report.py \
            .github/workflows/update-matches.yml \
            .github/workflows/pull-request-tests.yml \
            MOBILER_SPIELABRUF.md
          git commit -m "Mobilen Änderungsbericht für Spielabrufe ergänzen"
          git push -u origin "$BRANCH"

      - name: Draft-Pull-Request öffnen
        id: pr
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feature/mobile-spielabruf-report-v1
        run: |
          cat > /tmp/pr-body.md <<'PRBODY'
          ## Inhalt

          - verständliche Actions-Zusammenfassung mit neuen, geänderten und entfernten Spielen
          - Schutz vor leerem oder massiv geschrumpftem Feed
          - sicherer Testlauf auf einem Branch ohne Veröffentlichung
          - automatische Pull-Request-Tests
          - mobile Bedienungsanleitung

          ## Prüfung

          Der Installer führt vor dem Push die vollständige bestehende Testsuite sowie die neuen Vergleichstests aus.

          **Noch nicht nach main mergen.** Zuerst den echten Abruf auf dem Test-Branch ausführen und die Summary prüfen.
          PRBODY
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --draft \
            --title "Mobilen Änderungsbericht für Spielabrufe ergänzen" \
            --body-file /tmp/pr-body.md

      - name: Ergebnis anzeigen
        if: always()
        shell: bash
        env:
          BRANCH: feature/mobile-spielabruf-report-v1
        run: |
          {
            echo "## Mobiler Spielabruf vorbereitet"
            echo ""
            echo "- Branch: $BRANCH"
            echo "- Tests wurden vor dem Push ausgeführt."
            if [ "${{ steps.pr.outcome }}" = "success" ]; then
              echo "- Draft-Pull-Request wurde geöffnet."
            else
              echo "- GitHub hat das automatische Öffnen des Pull Requests nicht erlaubt."
              echo "- Öffne anschließend: https://github.com/${{ github.repository }}/compare/main...$BRANCH?expand=1"
            fi
            echo ""
            echo "Nächster Schritt: den Workflow **SSV53 Heimspiele aktualisieren** auf dem Test-Branch starten."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Einmaligen Installer wieder von main entfernen
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SELF_PATH: .github/workflows/install-mobile-spielabruf.yml
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          if [ -f "$SELF_PATH" ]; then
            rm "$SELF_PATH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$SELF_PATH"
            git commit -m "Einmaligen Spielabruf-Installer entfernen"
            git push origin main
          fi
