name: SSV53 Bestell-Mail über Azure installieren V3

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Exakt SSV53-ORDER-MAIL-INSTALL eingeben"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ssv53-order-mail-installer
  cancel-in-progress: false

jobs:
  install:
    name: Bestell-Mail sicher installieren und OVH-Zugang prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      MIGRATION_BRANCH: feature/azure-mower-migration
      RESOURCE_GROUP: rg-ssv53-platzpflege-prod
      FUNCTION_APP: func-ssv53platzpflege-prod-q7kbw54s
      PATCH_B64: 

    steps:
      - name: Harte Freigabe prüfen
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CLIENT_ID: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          # workflow_dispatch wird bewusst vom Default-Branch gestartet.
          # Checkout und Git-Push sind weiter fest auf feature/azure-mower-migration begrenzt.
          [ "$CONFIRMATION" = "SSV53-ORDER-MAIL-INSTALL" ] || {
            echo "Explizite Bestätigung fehlt." >&2
            exit 1
          }
          for variable in CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            [ -n "${!variable:-}" ] || {
              echo "Erforderliche GitHub-Variable $variable fehlt." >&2
              exit 1
            }
          done

      - name: Azure-Migrationsstand laden
        uses: actions/checkout@v7
        with:
          ref: feature/azure-mower-migration
          fetch-depth: 0

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Bestell-Mail-Code einspielen
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/install_order_mail.py
          python /tmp/install_order_mail.py

      - name: Abhängigkeiten installieren und Gesamttests ausführen
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m compileall -q function_app.py order_mail.py mower occupancy scripts
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: FULL_FAILSAFE-Paket mit Maildienst bauen und prüfen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          python scripts/build_azure_full_failsafe_package.py             --repository-root .             --output dist/ssv53-platzpflege-full-failsafe-order-mail.zip             | tee dist/order-mail-package.json

          python - <<'PY'
          import json
          import zipfile

          path = "dist/ssv53-platzpflege-full-failsafe-order-mail.zip"
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              assert "order_mail.py" in names
              assert "function_app.py" in names
              manifest = json.loads(
                  archive.read("package-manifest.json").decode("utf-8")
              )
              assert (
                  manifest["safety_stage"]
                  == "FULL_FAILSAFE_7_ZONES_90_MIN_CAPABLE_LOCKED"
              )
              joined = b"\n".join(
                  archive.read(name)
                  for name in names
                  if name.endswith(".py")
              )
              assert b"SSV53_ORDER_MAIL_ENABLED" in joined
              assert b"smtplib" in joined
          print("FULL_FAILSAFE-Paket inklusive Bestell-Mail geprüft.")
          PY

      - name: Geprüften Quellstand im Migrationsbranch sichern
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             order_mail.py             tests/test_order_mail.py             function_app.py             scripts/build_azure_source_package.py             scripts/build_azure_park_only_package.py             scripts/build_azure_full_mower_package.py             scripts/build_azure_full_failsafe_package.py 
          if git diff --cached --quiet; then
            echo "Quellstand enthält die Bestell-Mail-Änderungen bereits."
          else
            git commit -m "Add secure Azure order-ready email service"
            git push origin HEAD:feature/azure-mower-migration
          fi

      - name: Per OIDC mit Azure anmelden
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Mail-Appsettings sicher prüfen
        shell: bash
        run: |
          set -euo pipefail
          az functionapp config appsettings list             --resource-group "$RESOURCE_GROUP"             --name "$FUNCTION_APP"             --output json > /tmp/order-mail-settings.json

          python - <<'PY'
          import json

          rows = json.load(open("/tmp/order-mail-settings.json", encoding="utf-8"))
          values = {row["name"]: str(row.get("value", "")) for row in rows}

          expected = {
              "SSV53_ORDER_MAIL_ENABLED": "false",
              "SSV53_ORDER_MAIL_SMTP_HOST": "smtp.mail.ovh.net",
              "SSV53_ORDER_MAIL_SMTP_PORT": "587",
              "SSV53_ORDER_MAIL_SMTP_USERNAME": "info@ssv53.de",
              "SSV53_ORDER_MAIL_FROM_ADDRESS": "info@ssv53.de",
          }
          for key, value in expected.items():
              actual = values.get(key, "")
              if actual.casefold() != value.casefold():
                  raise SystemExit(
                      f"{key} ist unerwartet: {actual!r} (erwartet {value!r})"
                  )

          secret_ref = values.get("SSV53_ORDER_MAIL_SMTP_PASSWORD", "")
          if not secret_ref.startswith("@Microsoft.KeyVault("):
              raise SystemExit(
                  "SSV53_ORDER_MAIL_SMTP_PASSWORD ist keine Key-Vault-Referenz."
              )

          print("Mail-Appsettings vorhanden; produktiver Versand bleibt deaktiviert.")
          PY

      - name: Verriegelten FULL_FAILSAFE-Code deployen
        shell: bash
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip             --resource-group "$RESOURCE_GROUP"             --name "$FUNCTION_APP"             --src dist/ssv53-platzpflege-full-failsafe-order-mail.zip             --build-remote true             --timeout 900             --output none

      - name: Auf Registrierung der neuen Function warten
        shell: bash
        run: |
          set -euo pipefail
          found=""
          for i in $(seq 1 18); do
            found="$(az functionapp function list               --resource-group "$RESOURCE_GROUP"               --name "$FUNCTION_APP"               --query "[?contains(name, 'ssv53_order_mail')].name | [0]"               --output tsv 2>/dev/null || true)"
            if [ -n "$found" ]; then
              echo "Function registriert: $found"
              break
            fi
            sleep 10
          done
          [ -n "$found" ] || {
            echo "Neue Bestell-Mail-Function wurde nicht registriert." >&2
            exit 1
          }

      - name: Funktionsspezifischen Appack-Schlüssel anlegen
        shell: bash
        run: |
          set -euo pipefail

          EXISTING="$(az functionapp function keys list             --resource-group "$RESOURCE_GROUP"             --name "$FUNCTION_APP"             --function-name ssv53_order_mail             --query '"appack-order-admin"'             --output tsv 2>/dev/null || true)"

          if [ -z "$EXISTING" ]; then
            KEY_VALUE="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(36))
          PY
          )"
            az functionapp function keys set               --resource-group "$RESOURCE_GROUP"               --name "$FUNCTION_APP"               --function-name ssv53_order_mail               --key-name appack-order-admin               --key-value "$KEY_VALUE"               --output none
            unset KEY_VALUE
            echo "Funktionsspezifischer Schlüssel appack-order-admin wurde angelegt."
          else
            echo "Funktionsspezifischer Schlüssel appack-order-admin ist bereits vorhanden."
          fi

      - name: OVH SMTP-Anmeldung testen – keine Mail senden
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_KEY="$(az functionapp function keys list             --resource-group "$RESOURCE_GROUP"             --name "$FUNCTION_APP"             --function-name ssv53_order_mail             --query '"appack-order-admin"'             --output tsv)"

          [ -n "$FUNCTION_KEY" ] || {
            echo "Funktionsspezifischer Schlüssel konnte nicht gelesen werden." >&2
            exit 1
          }

          export FUNCTION_KEY
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          app = os.environ["FUNCTION_APP"]
          key = os.environ["FUNCTION_KEY"]
          url = (
              f"https://{app}.azurewebsites.net/api/order-mail?"
              + urllib.parse.urlencode({"code": key})
          )
          request = urllib.request.Request(
              url,
              data=json.dumps({"action": "check"}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
          if not payload.get("ok") or not payload.get("smtpAuthenticated"):
              raise SystemExit(f"SMTP-Prüfung fehlgeschlagen: {payload}")
          if payload.get("mailEnabled") is not False:
              raise SystemExit(
                  "Sicherheitsfehler: produktiver Mailversand ist bereits aktiviert."
              )
          print(
              "OVH SMTP erfolgreich authentifiziert. "
              "Es wurde ausdrücklich keine E-Mail gesendet."
          )
          PY
          unset FUNCTION_KEY

      - name: Azure-Sitzung beenden
        if: always()
        shell: bash
        run: az logout || true

      - name: Ergebnis zusammenfassen
        if: always()
        shell: bash
        run: |
          {
            echo "# SSV53 Bestell-Mail – Installationsstand"
            echo
            echo "- Azure-Mail-Endpunkt: **installiert**"
            echo "- OVH SMTP: **Anmeldung wird geprüft**"
            echo "- SMTP-Passwort: **nur über Key Vault**"
            echo "- Schutz: **funktionsspezifischer Schlüssel**"
            echo "- Doppelversand-Schutz: **Azure Table Storage**"
            echo "- Produktiver Mailversand: **weiterhin deaktiviert**"
            echo "- E-Mail durch diesen Workflow versendet: **nein**"
            echo
            echo "Nächster Schritt nach grünem Lauf: Testmail gezielt freigeben."
          } >> "$GITHUB_STEP_SUMMARY"
