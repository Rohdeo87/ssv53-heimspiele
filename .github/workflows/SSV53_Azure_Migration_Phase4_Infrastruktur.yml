name: "Einmalig: Azure-Migration Phase 4 Infrastruktur vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Azure-Infrastruktur als Code vorbereiten
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Phase 4 im Migrationsbranch installieren und prüfen
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="feature/azure-mower-migration"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Der erwartete Migrationsbranch $BRANCH fehlt." >&2
            exit 1
          fi

          git switch "$BRANCH"
          git pull --ff-only origin "$BRANCH"

          python - <<'PYFILES'
          from __future__ import annotations

          import base64
          from pathlib import Path

          files = {
              'infra/main.bicep': '',
              'infra/main.parameters.example.json': '',
              'infra/README.md': '',
              'infra/AZURE_ACTIVATION_CHECKLIST.md': '',
              'tests/test_azure_infra.py': '',
              '.github/workflows/azure-infra-validate.yml': ''
          }

          for relative_path, encoded_content in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded_content))
              print(f"Erzeugt/aktualisiert: {target}")

          documentation = Path("AZURE_MIGRATION.md")
          phase_marker = "## Phase 4 – Azure-Infrastruktur als Code"
          addition = base64.b64decode('').decode("utf-8")
          current = (
              documentation.read_text(encoding="utf-8")
              if documentation.exists()
              else "# SSV53 Azure-Migration\n"
          )
          if phase_marker not in current:
              documentation.write_text(
                  current.rstrip() + "\n" + addition,
                  encoding="utf-8",
              )
              print("AZURE_MIGRATION.md um Phase 4 ergänzt.")
          else:
              print("Phase-4-Dokumentation ist bereits vorhanden.")
          PYFILES

          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m compileall -q mower function_app.py
          python -m unittest discover -s tests -p "test_*.py" -v

          az bicep install
          az bicep version
          az bicep build --file infra/main.bicep --outfile /tmp/ssv53-platzpflege-main.json

          python - <<'PYSAFE'
          import json
          from pathlib import Path

          bicep = Path("infra/main.bicep").read_text(encoding="utf-8")
          workflow = Path(
              ".github/workflows/azure-infra-validate.yml"
          ).read_text(encoding="utf-8")
          template = json.loads(
              Path("/tmp/ssv53-platzpflege-main.json").read_text(
                  encoding="utf-8"
              )
          )

          required_bicep = (
              "FlexConsumption",
              "version: '3.12'",
              "allowSharedKeyAccess: false",
              "MowerAutomationState",
              "CONTROL_MODE: controlMode",
              "ENABLE_LIVE_READS: string(enableLiveReads)",
              "Key Vault Secrets User",
              "UserAssignedIdentity",
          )
          missing = [value for value in required_bicep if value not in bicep]
          if missing:
              raise SystemExit(
                  f"Erwartete Infrastruktur-Sicherheitsmerkmale fehlen: {missing}"
              )

          forbidden_bicep = (
              "Microsoft.KeyVault/vaults/secrets",
              "ParkUntilFurtherNotice",
              "StartInWorkArea",
          )
          found = [value for value in forbidden_bicep if value in bicep]
          if found:
              raise SystemExit(
                  f"Unerwartete Geheimnis- oder Gerätelogik im Bicep: {found}"
              )

          forbidden_workflow = (
              "azure/login",
              "az deployment",
              "azure/functions-action",
          )
          found_workflow = [
              value for value in forbidden_workflow if value in workflow
          ]
          if found_workflow:
              raise SystemExit(
                  "Der Validierungsworkflow darf nicht deployen: "
                  f"{found_workflow}"
              )

          resource_types = {
              resource.get("type")
              for resource in template.get("resources", [])
          }
          required_types = {
              "Microsoft.Web/sites",
              "Microsoft.Web/serverfarms",
              "Microsoft.Storage/storageAccounts",
              "Microsoft.KeyVault/vaults",
              "Microsoft.ManagedIdentity/userAssignedIdentities",
              "Microsoft.Insights/components",
          }
          missing_types = sorted(required_types - resource_types)
          if missing_types:
              raise SystemExit(
                  f"Erwartete Azure-Ressourcentypen fehlen: {missing_types}"
              )

          print("Bicep und alle Phase-4-Sicherheitsgrenzen sind gültig.")
          PYSAFE

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add infra/main.bicep infra/main.parameters.example.json infra/README.md infra/AZURE_ACTIVATION_CHECKLIST.md tests/test_azure_infra.py .github/workflows/azure-infra-validate.yml AZURE_MIGRATION.md

          if git diff --cached --quiet; then
            echo "Phase 4 war bereits vollständig vorhanden."
          else
            git commit -m "Azure Phase 4 Infrastruktur als Code vorbereiten"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Einmaligen Installer aus main entfernen
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          INSTALLER=".github/workflows/SSV53_Azure_Migration_Phase4_Infrastruktur.yml"

          git switch main
          git pull --ff-only origin main
          rm -f "$INSTALLER"

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -A "$INSTALLER"
          if git diff --cached --quiet; then
            echo "Installer war bereits entfernt."
          else
            git commit -m "Einmaligen Azure-Phase-4-Installer entfernen"
            git push origin HEAD:main
          fi

      - name: Ergebnis zusammenfassen
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "# Azure-Migration Phase 4 vorbereitet"
            echo
            echo "- Branch: \`feature/azure-mower-migration\`"
            echo "- Flex-Consumption-Infrastruktur als Bicep ergänzt"
            echo "- Python 3.12 und minutengenauer Timer vorbereitet"
            echo "- Managed Identity, Storage, Zustands-Tabelle und Key Vault ergänzt"
            echo "- Application Insights und Log Analytics ergänzt"
            echo "- Sichere Defaults: DRY_RUN und Live-Abfragen deaktiviert"
            echo "- Keine Geheimniswerte im Repository"
            echo "- Validierungsworkflow besitzt keine Azure-Anmeldung und kein Deploymentrecht"
            echo "- Noch keine Azure-Ressourcen bereitgestellt"
          } >> "$GITHUB_STEP_SUMMARY"
