      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nur Mähplan-Tests ausführen
        run: python -m unittest tests.test_mower_schedule -v

      - name: Dateien speichern
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/mower-dry-run.yml mower tests/test_mower_schedule.py MAEHPLAN_AUTOMATIK.md INSTALLATION.md
          if git diff --cached --quiet; then
            echo "Die Mähplan-Dateien sind bereits auf dem aktuellen Stand."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mähplan Dry Run mit Hydrawise ergänzen"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Ergebnis
        run: |
          echo "### Installation abgeschlossen" >> "$GITHUB_STEP_SUMMARY"
          echo "Der Dry-Run-Workflow wurde installiert und die fünf Mähplan-Tests waren erfolgreich." >> "$GITHUB_STEP_SUMMARY"
          echo "Starte jetzt unter Actions den Workflow **SSV53 Mähplan Dry Run**." >> "$GITHUB_STEP_SUMMARY"
