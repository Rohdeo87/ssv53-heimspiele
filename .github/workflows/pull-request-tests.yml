name: SSV53 Code prüfen

on:
  pull_request:
    branches:
      - main
      - feature/azure-mower-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Dateien laden
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-test.txt

      - name: Alle Tests ausführen
        run: python -m pytest -q tests

      - name: Appack-Anzeigen und Bedienregeln prüfen
        run: node --test tests/test_appack*.js

      - name: Platzpflege-Design und CMS-Kopierfassung abgleichen
        run: python scripts/sync_platzpflege_design.py --check

      - name: Python-Dateien kompilieren
        run: python -m compileall -q .
