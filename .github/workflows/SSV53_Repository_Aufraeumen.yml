name: "Einmalig: SSV53-Repository aufräumen"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Zum Ausführen exakt AUFRAEUMEN eingeben"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: ssv53-repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Bestätigung und Wartungstoken prüfen
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "AUFRAEUMEN" ]; then
            echo "Abbruch: Bestätigung stimmt nicht." >&2
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "Abbruch: SSV53_AUTOMATION_TOKEN fehlt." >&2
            exit 1
          fi

      - name: main mit Wartungstoken laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}

      - name: Finale Dateien schreiben und Altstände entfernen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          from pathlib import Path

          FILES = json.loads("{\".github/workflows/mower-plan.yml\":\"\",\".github/workflows/mower-decision.yml\":\"\",\"MAEHPLAN_AUTOMATIK.md\":\"\"}")
          OLD_PATHS = json.loads("[\".github/workflows/SSV53_Handy_Installer_Maehplan.yml\",\".github/workflows/SSV53_Handy_Installer_Maehplan_V2.yml\",\".github/workflows/SSV53_Handy_Installer_Maehplan_V3.yml\",\".github/workflows/SSV53_Handy_Installer_Maehplan_V4.yml\",\".github/workflows/SSV53_Handy_Installer_Maehplan_V5.yml\",\".github/workflows/SSV53_Maehentscheidung_Dry_Run.yml\",\".github/workflows/SSV53_Maehentscheidung_Dry_Run_V2.yml\",\".github/workflows/SSV53_Husqvarna_Lesetest.yml\",\".github/workflows/mower-dry-run.yml\",\".github/workflows/prepare-release-12.3.yml\",\".github/workflows/test-notification.yml\",\".github/workflows/SSV53_Repository_Aufraeumen.yml\",\"INSTALLATION.md\"]")

          for relative_path, encoded_content in FILES.items():
              path = Path(relative_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded_content))
              print(f"Final geschrieben: {relative_path}")

          for relative_path in OLD_PATHS:
              path = Path(relative_path)
              if path.exists():
                  path.unlink()
                  print(f"Altstand entfernt: {relative_path}")
          PY

      - name: Prüfwerkzeug installieren
        run: python -m pip install --quiet "PyYAML==6.0.2"

      - name: Bereinigung vollständig prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/workflows/mower-plan.yml
          test -f .github/workflows/mower-decision.yml
          test -f MAEHPLAN_AUTOMATIK.md
          test ! -f INSTALLATION.md

          if find .github/workflows -maxdepth 1 -type f               \( -name 'SSV53_Handy_Installer_Maehplan*.yml'               -o -name 'SSV53_Maehentscheidung_Dry_Run*.yml'               -o -name 'SSV53_Husqvarna_Lesetest.yml'               -o -name 'prepare-release-12.3.yml'               -o -name 'test-notification.yml'               -o -name 'SSV53_Repository_Aufraeumen.yml' \)               | grep -q .; then
            echo "Es sind noch zu entfernende Workflow-Altstände vorhanden." >&2
            exit 1
          fi

          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path
          import yaml

          for path in (
              Path(".github/workflows/mower-plan.yml"),
              Path(".github/workflows/mower-decision.yml"),
          ):
              text = path.read_text(encoding="utf-8")
              parsed = yaml.safe_load(text)
              if not isinstance(parsed, dict) or "name" not in parsed:
                  raise SystemExit(f"Ungültiger Workflow: {path}")

              for match in re.finditer(
                  r"python - <<'PY'\n(.*?)\n          PY",
                  text,
                  flags=re.S,
              ):
                  code = "\n".join(
                      line[10:] if line.startswith("          ") else line
                      for line in match.group(1).splitlines()
                  )
                  compile(code, f"{path}:embedded-python", "exec")
          PY

          REQUIRED=(
            mower/__init__.py
            mower/config.json
            mower/generate_schedule.py
            mower/hydrawise.py
            mower/planner.py
            tests/test_mower_schedule.py
            public/rasen.ics
          )
          for path in "${REQUIRED[@]}"; do
            test -f "$path" || { echo "Erforderliche Datei fehlt: $path" >&2; exit 1; }
          done

          python -m compileall -q mower
          python -m unittest tests.test_mower_schedule -v
          rm -rf generated/cleanup-test
          python -m mower.generate_schedule             --config mower/config.json             --matches public/rasen.ics             --output generated/cleanup-test             --start-date 24.8.26             --days 2             --no-hydrawise
          test -s generated/cleanup-test/mowing_plan.json
          test -s generated/cleanup-test/mowing_plan.md

          # Testartefakte und Python-Caches dürfen nicht in den Bereinigungscommit gelangen.
          rm -rf generated/cleanup-test
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Änderungen kontrolliert nach main übertragen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Keine Bereinigungsänderungen erforderlich."
          else
            echo "Geplante Änderungen:"
            git diff --cached --name-status
            git commit -m "Repository bereinigen und Mähworkflows konsolidieren"
            git push origin HEAD:main
          fi

          for branch in             feature/mobile-spielabruf-report-v1             feature/spielabruf-benachrichtigungen-v1             release/12.3
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch" ||                 echo "Hinweis: Branch $branch konnte nicht automatisch gelöscht werden."
            fi
          done

          if gh issue view 3 --repo "$GITHUB_REPOSITORY" --json state               --jq '.state' 2>/dev/null | grep -qx OPEN; then
            gh issue close 3               --repo "$GITHUB_REPOSITORY"               --comment "Testbenachrichtigung nach erfolgreicher Prüfung geschlossen."
          fi

      - name: Zusammenfassung
        if: always()
        shell: bash
        run: |
          {
            echo "## Repository-Bereinigung"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Die Bereinigung wurde erfolgreich abgeschlossen."
              echo ""
              echo "- Finale Workflows: mower-plan.yml und mower-decision.yml"
              echo "- Versionierte Installer und Testworkflows wurden entfernt."
              echo "- Die zentrale Dokumentation wurde aktualisiert."
              echo "- Gemergte Arbeitsbranches wurden soweit möglich gelöscht."
              echo "- Der Aufräum-Workflow hat sich selbst aus dem Repository entfernt."
            else
              echo "❌ Die Bereinigung wurde abgebrochen."
              echo "- Ein fehlgeschlagener Test verhindert den Push nach main."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
