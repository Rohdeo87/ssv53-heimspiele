name: SSV53 Runtime-Config Rollout

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Nur validieren oder validieren + nach Azure veröffentlichen"
        required: true
        type: choice
        options:
          - validate
          - publish
        default: validate
      publish_confirmation:
        description: "Nur bei publish exakt SSV53-RUNTIME-CONFIG-PUBLISH eintragen"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: ssv53-runtime-config-rollout
  cancel-in-progress: false

env:
  MIGRATION_BRANCH: feature/azure-mower-migration
  RUNTIME_CONTAINER: runtime-config
  MAX_SOURCE_AGE_MINUTES: "720"

jobs:
  validate:
    name: Aktuelle Daten bauen und vollständig prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Branch-Sicherheitsgate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "$MIGRATION_BRANCH" ]; then
            echo "Dieser Workflow darf nur auf $MIGRATION_BRANCH ausgeführt werden." >&2
            exit 1
          fi

      - name: Migrationsstand laden
        uses: actions/checkout@v7
        with:
          ref: feature/azure-mower-migration
          fetch-depth: 1

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren und Gesamttests ausführen
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m compileall -q mower occupancy scripts function_app.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Geprüften Spielbestand des Migrationsstands laden
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/runtime-source"
          mkdir -p "$SOURCE_DIR"

          SOURCE_SHA="$(git rev-parse HEAD)"

          for name in included_matches.json summary.json quality_report.json; do
            cp "public/$name" "$SOURCE_DIR/$name"
            test -s "$SOURCE_DIR/$name"
          done

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"

      - name: Runtime-Bundle mit aktuellen Zeitregeln bauen
        id: bundle
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          VERSION="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUNDLE_DIR="$RUNNER_TEMP/runtime-config-bundle"

          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"

          python scripts/build_runtime_config_bundle.py \
            --mower-config mower/config.json \
            --timing-config config.json \
            --included-matches "$SOURCE_DIR/included_matches.json" \
            --source-summary "$SOURCE_DIR/summary.json" \
            --source-quality "$SOURCE_DIR/quality_report.json" \
            --output "$BUNDLE_DIR" \
            --version "$VERSION" \
            --published-at "$PUBLISHED_AT" \
            --source-commit "$SOURCE_SHA" \
            --max-source-age-minutes "$MAX_SOURCE_AGE_MINUTES"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_dir=$BUNDLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Erzeugtes Manifest mit dem Produktionsmodul laden
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.bundle.outputs.bundle_dir }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import tempfile

          from mower.config_source import resolve_runtime_inputs

          bundle = Path(os.environ["BUNDLE_DIR"])
          manifest = json.loads(
              (bundle / "current" / "manifest.json").read_text(encoding="utf-8")
          )
          blobs = {
              "current/manifest.json": (bundle / "current" / "manifest.json").read_bytes(),
              manifest["config_blob"]: (bundle / manifest["config_blob"]).read_bytes(),
              manifest["matches_blob"]: (bundle / manifest["matches_blob"]).read_bytes(),
          }

          class Download:
              def __init__(self, payload): self.payload = payload
              def readall(self): return self.payload

          class Props:
              etag = '"runtime-candidate-etag"'

          class Blob:
              def __init__(self, payload): self.payload = payload
              def get_blob_properties(self): return Props()
              def download_blob(self): return Download(self.payload)

          class Container:
              def get_blob_client(self, name): return Blob(blobs[name])

          class Service:
              def get_container_client(self, _name): return Container()

          published = datetime.fromisoformat(manifest["published_at_utc"]).astimezone(timezone.utc)
          with tempfile.TemporaryDirectory() as cache:
              result = resolve_runtime_inputs(
                  {
                      "SSV53_DYNAMIC_CONFIG_ENABLED": "true",
                      "SSV53_CONFIG_STORAGE_ACCOUNT_URL": "https://example.blob.core.windows.net",
                      "SSV53_CONFIG_CONTAINER": "runtime-config",
                      "SSV53_CONFIG_MANAGED_IDENTITY_CLIENT_ID": "candidate-test-client",
                      "SSV53_CONFIG_CACHE_DIR": cache,
                      "SSV53_CONFIG_MAX_AGE_MINUTES": "1440",
                  },
                  now_utc=published,
                  service_client_factory=lambda **_: Service(),
                  credential_factory=lambda **_: object(),
              )
              assert result.source_kind == "azure_blob"
              assert result.manifest_path == "current/manifest.json"
              assert not result.fallback_used
          print("Erzeugtes Bundle wurde vom Produktionsmodul vollständig akzeptiert.")
          PY

      - name: Kandidat als GitHub-Artefakt sichern
        uses: actions/upload-artifact@v7
        with:
          name: ssv53-runtime-config-candidate
          path: ${{ steps.bundle.outputs.bundle_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Validierung zusammenfassen
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.bundle.outputs.bundle_dir }}
        run: |
          set -euo pipefail
          SUMMARY="$(cat "$BUNDLE_DIR/validation-summary.json")"
          {
            echo "# SSV53 Runtime-Config"
            echo
            echo "- Gesamttests: **bestanden**"
            echo "- Quelldaten höchstens 12 Stunden alt: **bestätigt**"
            echo "- Altersklassen und Spielzeiten: **neu berechnet**"
            echo "- 60-Minuten-Spielsperren: **bestätigt**"
            echo "- Trainings- und Beregnungspuffer: **bestätigt**"
            echo "- Alle Rasenspiele übernommen: **bestätigt**"
            echo "- Manifest und SHA256: **bestätigt**"
            echo "- Gerätebefehle: **keine**"
            echo
            echo '```json'
            echo "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Validiertes Bundle atomar veröffentlichen
    if: ${{ inputs.operation == 'publish' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Publish-Sicherheitsgate
        shell: bash
        env:
          PUBLISH_ENABLED: ${{ vars.AZURE_RUNTIME_CONFIG_PUBLISH_ENABLED }}
          RUNTIME_CLIENT_ID: ${{ vars.AZURE_RUNTIME_CONFIG_CLIENT_ID }}
          STORAGE_ACCOUNT: ${{ vars.AZURE_RUNTIME_CONFIG_STORAGE_ACCOUNT }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          PUBLISH_CONFIRMATION: ${{ inputs.publish_confirmation }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "$MIGRATION_BRANCH" ]
          [ "$PUBLISH_CONFIRMATION" = "SSV53-RUNTIME-CONFIG-PUBLISH" ]
          [ "${PUBLISH_ENABLED:-}" = "true" ]
          for variable in RUNTIME_CLIENT_ID STORAGE_ACCOUNT TENANT_ID SUBSCRIPTION_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "Erforderliche GitHub-Variable ${variable} fehlt." >&2
              exit 1
            fi
          done

      - name: Kandidat laden
        uses: actions/download-artifact@v5
        with:
          name: ssv53-runtime-config-candidate
          path: ${{ runner.temp }}/runtime-config-bundle

      - name: Per OIDC mit eng begrenzter Runtime-Identität anmelden
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_RUNTIME_CONFIG_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Versionierte Dateien veröffentlichen und zurückprüfen
        shell: bash
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_RUNTIME_CONFIG_STORAGE_ACCOUNT }}
          BUNDLE_DIR: ${{ runner.temp }}/runtime-config-bundle
        run: |
          set -euo pipefail
          MANIFEST="$BUNDLE_DIR/current/manifest.json"
          VERSION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$MANIFEST")"
          CONFIG_BLOB="versions/$VERSION/mower/config.json"
          MATCHES_BLOB="versions/$VERSION/public/rasen.ics"
          CONFIG_FILE="$BUNDLE_DIR/$CONFIG_BLOB"
          MATCHES_FILE="$BUNDLE_DIR/$MATCHES_BLOB"
          PREVIOUS_MANIFEST="$RUNNER_TEMP/previous-manifest.json"
          CURRENT_SWITCHED=false

          rollback() {
            if [ "$CURRENT_SWITCHED" = "true" ] && [ -s "$PREVIOUS_MANIFEST" ]; then
              echo "Prüfung fehlgeschlagen; vorheriges current-Manifest wird wiederhergestellt." >&2
              az storage blob upload \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$RUNTIME_CONTAINER" \
                --name current/manifest.json \
                --file "$PREVIOUS_MANIFEST" \
                --auth-mode login \
                --overwrite true \
                --only-show-errors
            fi
          }
          trap rollback ERR

          test -s "$MANIFEST"
          test -s "$CONFIG_FILE"
          test -s "$MATCHES_FILE"

          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$RUNTIME_CONTAINER" \
            --name current/manifest.json \
            --file "$PREVIOUS_MANIFEST" \
            --auth-mode login \
            --overwrite true \
            --only-show-errors

          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$RUNTIME_CONTAINER" \
            --name previous/manifest.json \
            --file "$PREVIOUS_MANIFEST" \
            --auth-mode login \
            --overwrite true \
            --only-show-errors

          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$RUNTIME_CONTAINER" \
            --name "$CONFIG_BLOB" \
            --file "$CONFIG_FILE" \
            --auth-mode login \
            --overwrite false \
            --only-show-errors

          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$RUNTIME_CONTAINER" \
            --name "$MATCHES_BLOB" \
            --file "$MATCHES_FILE" \
            --auth-mode login \
            --overwrite false \
            --only-show-errors

          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$RUNTIME_CONTAINER" \
            --name current/manifest.json \
            --file "$MANIFEST" \
            --auth-mode login \
            --overwrite true \
            --only-show-errors
          CURRENT_SWITCHED=true

          VERIFY_DIR="$RUNNER_TEMP/runtime-verify"
          mkdir -p "$VERIFY_DIR"
          az storage blob download --account-name "$STORAGE_ACCOUNT" --container-name "$RUNTIME_CONTAINER" --name current/manifest.json --file "$VERIFY_DIR/manifest.json" --auth-mode login --overwrite true --only-show-errors
          az storage blob download --account-name "$STORAGE_ACCOUNT" --container-name "$RUNTIME_CONTAINER" --name "$CONFIG_BLOB" --file "$VERIFY_DIR/config.json" --auth-mode login --overwrite true --only-show-errors
          az storage blob download --account-name "$STORAGE_ACCOUNT" --container-name "$RUNTIME_CONTAINER" --name "$MATCHES_BLOB" --file "$VERIFY_DIR/rasen.ics" --auth-mode login --overwrite true --only-show-errors

          export MANIFEST VERIFY_DIR
          python - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path

          source = json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          verify = Path(os.environ["VERIFY_DIR"])
          remote = json.loads((verify / "manifest.json").read_text(encoding="utf-8"))
          assert remote == source, "Remote-Manifest weicht vom Kandidaten ab."
          assert sha256((verify / "config.json").read_bytes()).hexdigest() == source["config_sha256"]
          assert sha256((verify / "rasen.ics").read_bytes()).hexdigest() == source["matches_sha256"]
          print("Remote Manifest und beide SHA256-Prüfungen erfolgreich.")
          PY

          CURRENT_SWITCHED=false
          trap - ERR
          {
            echo "# SSV53 Runtime-Config – Publish"
            echo
            echo "- Version: **$VERSION**"
            echo "- Aktuelle Spieldaten: **validiert und veröffentlicht**"
            echo "- previous/manifest.json: **gesichert**"
            echo "- Rückprüfung: **bestanden**"
            echo "- CONTROL_MODE geändert: **nein**"
            echo "- Gerätebefehle: **keine**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure-Sitzung beenden
        if: ${{ always() }}
        shell: bash
        run: az logout || true

  notification:
    name: Ausfallwarnung synchronisieren
    if: ${{ always() && inputs.operation == 'publish' }}
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: GitHub-Issue bei Ausfall öffnen oder nach Erholung schließen
        uses: actions/github-script@v8
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        with:
          script: |
            const title = "[Automatik] Azure-Laufzeitdaten nicht aktualisiert";
            const failed = process.env.VALIDATE_RESULT !== "success" || process.env.PUBLISH_RESULT !== "success";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (failed) {
              const body = `Die automatische Veröffentlichung der frischen Platzbelegungsdaten ist fehlgeschlagen.\n\nLauf: ${runUrl}\n\nDie Azure-Steuerung bleibt dadurch fail-closed; Mäher- und Beregnungsbefehle werden nicht freigegeben.`;
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Die Runtime-Konfiguration wurde wieder erfolgreich veröffentlicht.\n\nLauf: ${runUrl}`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: "closed" });
            }
