name: "Einmalig: Spielabruf-Benachrichtigungen V3"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ssv53-notification-installer-v3
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TARGET_BRANCH: feature/spielabruf-benachrichtigungen-v1
      SELF_PATH: .github/workflows/install-spielabruf-benachrichtigungen-v3.yml
      OLD_INSTALLER_PATH: .github/workflows/install-spielabruf-benachrichtigungen.yml
      EXPECTED_BASE_BLOB: 883203b9a939faab93f3534a2be922371f94e6ad
      EXPECTED_UPDATED_BLOB: e845b050b215a5e712e4ccb99c494aaaa1440c5b

    steps:
      - name: Automatisierungstoken prüfen
        shell: bash
        env:
          AUTOMATION_TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "Das Repository-Secret SSV53_AUTOMATION_TOKEN fehlt."
            exit 1
          fi
          echo "Installer-Version: V3"

      - name: Aktuellen main-Stand laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}

      - name: Feature-Branch vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B "$TARGET_BRANCH" origin/main
          rm -f "$SELF_PATH" "$OLD_INSTALLER_PATH"

      - name: Benachrichtigungslogik vollständig einspielen
        shell: bash
        env:
          NOTIFY_B64: ""
          TESTS_B64: ""
          TEST_WORKFLOW_B64: ""
          UPDATED_WORKFLOW_B64: ""
          DOCS_B64: ""
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64
          import hashlib
          import os
          from pathlib import Path

          def decode(name: str) -> str:
              return base64.b64decode(os.environ[name]).decode("utf-8")

          workflow_path = Path(".github/workflows/update-matches.yml")
          current = workflow_path.read_bytes()
          current_blob = hashlib.sha1(
              f"blob {len(current)}\0".encode("utf-8") + current
          ).hexdigest()
          allowed = {
              os.environ["EXPECTED_BASE_BLOB"],
              os.environ["EXPECTED_UPDATED_BLOB"],
          }
          if current_blob not in allowed:
              raise RuntimeError(
                  "Der produktive Spielabruf-Workflow hat sich unerwartet verändert. "
                  f"Gefundener Blob: {current_blob}. Es wurde nichts überschrieben."
              )

          Path("notify_changes.py").write_text(decode("NOTIFY_B64"), encoding="utf-8")
          Path("tests/test_notifications.py").write_text(decode("TESTS_B64"), encoding="utf-8")
          Path(".github/workflows/test-notification.yml").write_text(
              decode("TEST_WORKFLOW_B64"), encoding="utf-8"
          )
          workflow_path.write_text(decode("UPDATED_WORKFLOW_B64"), encoding="utf-8")

          docs_path = Path("MOBILER_SPIELABRUF.md")
          docs = docs_path.read_text(encoding="utf-8")
          heading = "## Automatische Benachrichtigungen"
          if heading not in docs:
              docs = docs.rstrip() + "\n" + decode("DOCS_B64").lstrip()
              docs_path.write_text(docs.rstrip() + "\n", encoding="utf-8")

          updated = workflow_path.read_bytes()
          updated_blob = hashlib.sha1(
              f"blob {len(updated)}\0".encode("utf-8") + updated
          ).hexdigest()
          if updated_blob != os.environ["EXPECTED_UPDATED_BLOB"]:
              raise RuntimeError(
                  "Der erzeugte Workflow entspricht nicht der geprüften V3-Fassung."
              )
          print("V3-Dateien vollständig und reproduzierbar eingespielt.")
          PYCODE

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Vollständige Tests ausführen
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m compileall -q .
          python notify_changes.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --test \
            --test-id installer-v3 \
            --dry-run

      - name: Änderungen committen und pushen
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Keine Änderungen erforderlich."
          else
            git commit -m "GitHub-Benachrichtigungen für Spielabrufe ergänzen"
          fi

          git push --force-with-lease --set-upstream origin "HEAD:$TARGET_BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pull Request erstellen oder aktualisieren
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr list \
            --head "$TARGET_BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url // empty')"

          if [ -z "$PR_URL" ]; then
            cat > /tmp/pr-body.md <<'EOF'
          ## Inhalt

          - GitHub-Issue nur bei echten Spieländerungen, blockierter Veröffentlichung oder technischem Fehler
          - Zuweisung an den Repository-Inhaber für zuverlässige GitHub-Benachrichtigungen
          - keine Meldung bei unverändertem erfolgreichem Abruf
          - Deduplizierung identischer offener Warnungen
          - automatische Schließung technischer Warnungen nach erfolgreicher Erholung
          - separater Workflow zum Testen der Handy-Benachrichtigung
          - acht zusätzliche Unit-Tests

          ## Sicherheit

          - Benachrichtigungen werden nur bei Läufen auf `main` erzeugt.
          - Test-Branches erzeugen keine produktiven Issues.
          - Ein Benachrichtigungsfehler verändert den letzten sicheren Spielstand nicht.
          - Noch nicht mergen: zuerst automatische Pull-Request-Tests prüfen.
          EOF

            PR_URL="$(gh pr create \
              --base main \
              --head "$TARGET_BRANCH" \
              --title "GitHub-Benachrichtigungen für Spielabrufe ergänzen" \
              --body-file /tmp/pr-body.md \
              --draft)"
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Pull Request: $PR_URL"

      - name: Ergebnis zusammenfassen
        if: always()
        shell: bash
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          {
            echo "## SSV53-Spielabruf-Benachrichtigungen V3"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Benachrichtigungsfunktion auf einem Test-Branch vorbereitet."
              echo ""
              echo "- Pull Request: $PR_URL"
              echo "- Produktiver Stand auf \`main\` noch unverändert."
              echo "- Alle bestehenden und acht neuen Tests wurden ausgeführt."
              echo "- Der alte und der V3-Installer werden aus \`main\` entfernt."
            else
              echo "❌ Vorbereitung fehlgeschlagen."
              echo "- Produktiver Spielabruf auf \`main\` wurde nicht verändert."
              echo "- Ausgeführt wurde eindeutig Installer V3."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alte und neue Installer wieder aus main entfernen
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f "$SELF_PATH" "$OLD_INSTALLER_PATH"
          git add -A

          if git diff --cached --quiet; then
            echo "Keine Installer-Dateien mehr auf main vorhanden."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Einmalige Benachrichtigungs-Installer entfernen"
            git push origin main
          fi
