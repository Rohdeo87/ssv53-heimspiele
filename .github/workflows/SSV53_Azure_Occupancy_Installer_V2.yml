name: SSV53 Azure Occupancy installieren und deployen V2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Exakt SSV53-AZURE-OCCUPANCY-DEPLOY eingeben"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ssv53-azure-occupancy-installer
  cancel-in-progress: false

jobs:
  install-and-deploy:
    name: Azure-Belegungsdienst installieren und prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      RESOURCE_GROUP: rg-ssv53-platzpflege-prod
      FUNCTION_APP: func-ssv53platzpflege-prod-q7kbw54s
      PATCH_B64: 

    steps:
      - name: Explizite Freigabe und Azure-Variablen prüfen
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CLIENT_ID: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ "${CONFIRMATION:-}" != "SSV53-AZURE-OCCUPANCY-DEPLOY" ]; then
            echo "Explizite Bestätigung fehlt." >&2
            exit 1
          fi
          for variable in CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "Erforderliche GitHub-Variable $variable fehlt." >&2
              exit 1
            fi
          done

      - name: Azure-Migrationsbranch laden
        uses: actions/checkout@v7
        with:
          ref: feature/azure-mower-migration
          fetch-depth: 0

      - name: Zentralen Azure-Belegungsdienst einbauen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os

          code = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(
              compile(code, "azure-occupancy-installer", "exec"),
              {"__name__": "__main__"},
          )
          PY

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Gesamttests und Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q mower occupancy function_app.py scripts
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: PARK_ONLY-Sicherheitsgrenzen erneut hart prüfen
        shell: bash
        run: |
          set -euo pipefail

          if grep -Fq '/actions' mower/husqvarna.py; then
            echo "Read-only Husqvarna-Modul enthält unerwartet Schreiblogik." >&2
            exit 1
          fi

          ACTION_FILES="$(grep -RIl --include='*.py' '/actions' mower || true)"
          if [ "$ACTION_FILES" != "mower/husqvarna_actions.py" ]; then
            echo "Action-Endpunkt ist nicht exakt auf den Park-Adapter begrenzt:" >&2
            echo "$ACTION_FILES" >&2
            exit 1
          fi

          grep -Fq 'ParkUntilFurtherNotice' mower/husqvarna_actions.py
          grep -Fq 'ENABLE_PARK_COMMANDS' mower/runtime.py

          if grep -R --line-number --include='*.py' -E             'ResumeSchedule|StartInWorkArea|def start_|"type"[[:space:]]*:[[:space:]]*"Start"'             mower occupancy function_app.py; then
            echo "Verbotene automatische Startfunktion gefunden." >&2
            exit 1
          fi

      - name: Verriegeltes Produktionspaket bauen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          python scripts/build_azure_park_only_package.py             --output dist/ssv53-platzpflege-park-only-locked.zip             | tee dist/occupancy-package-result.json

          python - <<'PY'
          import json
          import zipfile

          path = "dist/ssv53-platzpflege-park-only-locked.zip"
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              manifest = json.loads(
                  archive.read("package-manifest.json").decode("utf-8")
              )

              assert manifest["safety_stage"] == "PARK_ONLY_CAPABLE_LOCKED"
              assert manifest["automatic_start_implemented"] is False
              assert manifest["park_write_gate_required"] is True

              for required in (
                  "occupancy/config.json",
                  "occupancy/service.py",
                  "function_app.py",
                  "mower/husqvarna_actions.py",
                  "mower/park_only.py",
              ):
                  assert required in names, required

          print("OCCUPANCY_PAKET_SICHER=JA")
          PY

      - name: Änderungen auf Azure-Migrationsbranch committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             function_app.py             mower/config.json             occupancy             scripts/build_azure_source_package.py             scripts/build_azure_park_only_package.py             tests/test_occupancy_service.py

          if git diff --cached --quiet; then
            echo "Keine neuen Änderungen – Installation war bereits vorhanden."
          else
            git commit -m "Azure als zentrale Platzbelegungsquelle vorbereiten"
            git push origin HEAD:feature/azure-mower-migration
          fi

      - name: Per OIDC mit Azure anmelden
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Geprüftes Paket nach Azure deployen
        shell: bash
        run: |
          set -euo pipefail

          az functionapp deployment source config-zip             --resource-group "$RESOURCE_GROUP"             --name "$FUNCTION_APP"             --src dist/ssv53-platzpflege-park-only-locked.zip             --build-remote true             --timeout 900             --output none

          echo "Azure ZIP-Deployment erfolgreich."

      - name: Öffentlichen Belegungs-Endpunkt live prüfen
        shell: bash
        run: |
          set -euo pipefail

          API_URL="https://${FUNCTION_APP}.azurewebsites.net/api/occupancy?start=2026-08-11&end=2026-08-12&season=Sommer"

          ok=false
          for attempt in $(seq 1 18); do
            status="$(curl -sS -o /tmp/occupancy.json -w '%{http_code}' "$API_URL" || true)"
            if [ "$status" = "200" ]; then
              ok=true
              break
            fi
            echo "Versuch $attempt: HTTP $status – warte 10 Sekunden."
            sleep 10
          done

          if [ "$ok" != "true" ]; then
            echo "Azure-Occupancy-Endpunkt wurde nicht rechtzeitig HTTP 200." >&2
            cat /tmp/occupancy.json 2>/dev/null || true
            exit 1
          fi

          python - <<'PY'
          import json

          payload = json.load(open("/tmp/occupancy.json", encoding="utf-8"))
          assert payload["data_source"] == "azure"
          assert payload["effective_from"] == "2026-08-11"
          assert payload["season"] == "Sommer"

          actual = {
              (
                  event["title"],
                  event["resourceId"],
                  event["start"][11:16],
                  event["end"][11:16],
              )
              for event in payload["events"]
              if event["source"] == "training"
          }

          expected = {
              ("G", "kunstrasen", "16:30", "17:30"),
              ("F", "kunstrasen", "16:45", "18:15"),
              ("E1", "rasen", "17:00", "18:30"),
              ("A", "rasen", "18:30", "20:00"),
          }
          assert actual == expected, (actual, expected)

          print("AZURE_OCCUPANCY_LIVE=GRÜN")
          print("Training ab 11.08.2026 korrekt.")
          PY

      - name: Zusammenfassung
        shell: bash
        run: |
          {
            echo "# Azure Occupancy – Installation"
            echo
            echo "- Zentrale Azure-Belegungsquelle: **installiert**"
            echo "- Sommer-Trainingsplan gültig ab: **11.08.2026**"
            echo "- Rasen + Kunstrasen: **enthalten**"
            echo "- Heimspiele: **aus rasen.ics integriert**"
            echo "- Öffentlicher /api/occupancy-Endpunkt: **live geprüft**"
            echo "- PARK_ONLY-Sicherheitsgrenzen: **unverändert verriegelt**"
            echo "- Automatischer Mäherstart: **nicht implementiert**"
            echo "- Appack-Kalender verändert: **nein**"
            echo
            echo "Nächster Schritt: App-Belegungsplan von Appack-Terminen auf /api/occupancy umstellen."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure-Sitzung beenden
        if: ${{ always() }}
        shell: bash
        run: az logout || true
