name: SSV53 Husqvarna Lesetest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssv53-husqvarna-lesetest
  cancel-in-progress: true

jobs:
  read:
    name: Mäher ausschließlich lesen
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Husqvarna-Mäherstatus ausschließlich lesen
        shell: bash
        env:
          HUSQVARNA_CLIENT_ID: ${{ secrets.HUSQVARNA_CLIENT_ID }}
          HUSQVARNA_CLIENT_SECRET: ${{ secrets.HUSQVARNA_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p generated/husqvarna

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          AUTH_URL = "https://api.authentication.husqvarnagroup.dev/v1/oauth2/token"
          MOWERS_URL = "https://api.amc.husqvarna.dev/v1/mowers/"
          OUTPUT = Path("generated/husqvarna/husqvarna_read_test.json")
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY", "")

          client_id = os.environ.get("HUSQVARNA_CLIENT_ID", "").strip()
          client_secret = os.environ.get("HUSQVARNA_CLIENT_SECRET", "").strip()

          if not client_id:
              raise SystemExit("HUSQVARNA_CLIENT_ID fehlt in den GitHub-Secrets.")
          if not client_secret:
              raise SystemExit("HUSQVARNA_CLIENT_SECRET fehlt in den GitHub-Secrets.")

          def request_json(request: Request, label: str) -> dict[str, Any]:
              try:
                  with urlopen(request, timeout=30) as response:  # noqa: S310
                      payload = response.read().decode("utf-8")
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  # Antworten können technische Details enthalten, niemals Zugangsdaten.
                  raise SystemExit(
                      f"{label} fehlgeschlagen: HTTP {exc.code}. "
                      f"Antwort: {body[:500]}"
                  ) from exc
              except URLError as exc:
                  raise SystemExit(
                      f"{label} fehlgeschlagen: {exc.reason}"
                  ) from exc

              try:
                  parsed = json.loads(payload)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"{label} lieferte keine gültige JSON-Antwort."
                  ) from exc

              if not isinstance(parsed, dict):
                  raise SystemExit(
                      f"{label} lieferte ein unerwartetes Datenformat."
                  )
              return parsed

          token_body = urlencode(
              {
                  "grant_type": "client_credentials",
                  "client_id": client_id,
                  "client_secret": client_secret,
              }
          ).encode("utf-8")

          token_request = Request(
              AUTH_URL,
              data=token_body,
              method="POST",
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/x-www-form-urlencoded",
                  "User-Agent": "SSV53-Husqvarna-Lesetest/1.0",
              },
          )
          token_response = request_json(token_request, "Husqvarna-Anmeldung")
          access_token = str(token_response.get("access_token", "")).strip()
          if not access_token:
              raise SystemExit(
                  "Husqvarna-Anmeldung war erfolgreich, aber es wurde kein "
                  "Access-Token geliefert."
              )

          mower_request = Request(
              MOWERS_URL,
              method="GET",
              headers={
                  "Accept": "application/vnd.api+json",
                  "Authorization": f"Bearer {access_token}",
                  "Authorization-Provider": "husqvarna",
                  "Content-Type": "application/vnd.api+json",
                  "X-Api-Key": client_id,
                  "User-Agent": "SSV53-Husqvarna-Lesetest/1.0",
              },
          )
          mower_response = request_json(
              mower_request,
              "Abruf der Husqvarna-Mäher",
          )

          mower_items = mower_response.get("data", [])
          if not isinstance(mower_items, list):
              raise SystemExit(
                  "Die Husqvarna-API lieferte keine gültige Mäherliste."
              )

          def masked_id(value: Any) -> str:
              text = str(value or "")
              if len(text) <= 8:
                  return "***"
              return f"{text[:4]}…{text[-4:]}"

          def as_dict(value: Any) -> dict[str, Any]:
              return value if isinstance(value, dict) else {}

          def work_area_list(value: Any) -> list[dict[str, Any]]:
              if isinstance(value, list):
                  return [item for item in value if isinstance(item, dict)]
              if isinstance(value, dict):
                  for key in ("workAreas", "data", "items"):
                      candidate = value.get(key)
                      if isinstance(candidate, list):
                          return [
                              item for item in candidate
                              if isinstance(item, dict)
                          ]
              return []

          safe_mowers: list[dict[str, Any]] = []
          for item in mower_items:
              if not isinstance(item, dict):
                  continue

              attributes = as_dict(item.get("attributes"))
              system = as_dict(attributes.get("system"))
              battery = as_dict(attributes.get("battery"))
              mower = as_dict(attributes.get("mower"))
              planner = as_dict(attributes.get("planner"))
              override = as_dict(planner.get("override"))
              capabilities = as_dict(attributes.get("capabilities"))

              areas: list[dict[str, Any]] = []
              for area in work_area_list(attributes.get("workAreas")):
                  area_attributes = as_dict(area.get("attributes"))
                  source = area_attributes or area
                  areas.append(
                      {
                          "id": area.get("id", source.get("workAreaId")),
                          "name": source.get("name"),
                          "enabled": source.get(
                              "enable",
                              source.get("enabled"),
                          ),
                          "cutting_height": source.get("cuttingHeight"),
                      }
                  )

              safe_mowers.append(
                  {
                      # Seriennummer und GPS-Position werden bewusst nicht gespeichert.
                      "id_masked": masked_id(item.get("id")),
                      "name": system.get("name"),
                      "model": system.get("model"),
                      "battery_percent": battery.get("batteryPercent"),
                      "activity": mower.get("activity"),
                      "state": mower.get("state"),
                      "mode": mower.get("mode"),
                      "error_code": mower.get("errorCode"),
                      "planner_override_action": override.get("action"),
                      "planner_restricted_reason": planner.get(
                          "restrictedReason"
                      ),
                      "planner_next_start": planner.get(
                          "nextStartTimestamp"
                      ),
                      "work_areas": areas,
                      "capabilities": {
                          key: capabilities.get(key)
                          for key in sorted(capabilities)
                          if key in {
                              "workAreas",
                              "stayOutZones",
                              "position",
                              "headlights",
                              "canConfirmError",
                          }
                      },
                      "available_attribute_groups": sorted(attributes.keys()),
                  }
              )

          result = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "mode": "read_only",
              "requests_used": [
                  "POST Authentication API: OAuth2 token",
                  "GET Automower Connect API: mowers",
              ],
              "commands_sent": [],
              "mower_count": len(safe_mowers),
              "mowers": safe_mowers,
          }

          OUTPUT.write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Husqvarna-Lesetest",
              "",
              "✅ Verbindung zur Husqvarna-API erfolgreich.",
              "",
              f"- Gefundene Mäher: **{len(safe_mowers)}**",
              "- Betriebsart: **ausschließlich lesend**",
              "- Gesendete Mäherbefehle: **keine**",
              "",
          ]

          if not safe_mowers:
              lines.append(
                  "⚠️ Die Anmeldung funktionierte, aber dem Konto wurde "
                  "kein Mäher geliefert."
              )

          for index, mower_data in enumerate(safe_mowers, start=1):
              name = mower_data.get("name") or f"Mäher {index}"
              model = mower_data.get("model") or "nicht angegeben"
              lines.extend(
                  [
                      f"## {name}",
                      "",
                      f"- Modell: **{model}**",
                      f"- Mäher-ID: `{mower_data['id_masked']}`",
                      f"- Akku: **{mower_data.get('battery_percent')} %**",
                      f"- Aktivität: **{mower_data.get('activity')}**",
                      f"- Zustand: **{mower_data.get('state')}**",
                      f"- Modus: **{mower_data.get('mode')}**",
                      f"- Fehlercode: **{mower_data.get('error_code')}**",
                      (
                          "- Manueller/temporärer Planner-Override: "
                          f"**{mower_data.get('planner_override_action')}**"
                      ),
                      (
                          "- Einschränkungsgrund: "
                          f"**{mower_data.get('planner_restricted_reason')}**"
                      ),
                      (
                          "- Nächster geplanter Start: "
                          f"**{mower_data.get('planner_next_start')}**"
                      ),
                      f"- Erkannte Arbeitsbereiche: **{len(mower_data['work_areas'])}**",
                  ]
              )

              for area in mower_data["work_areas"]:
                  area_name = area.get("name") or "Unbenannter Bereich"
                  lines.append(
                      f"  - {area_name}: ID `{area.get('id')}`, "
                      f"aktiv `{area.get('enabled')}`, "
                      f"Schnitthöhe `{area.get('cutting_height')}`"
                  )
              lines.append("")

          markdown = "\n".join(lines).rstrip() + "\n"
          print(markdown)
          if SUMMARY:
              with Path(SUMMARY).open("a", encoding="utf-8") as handle:
                  handle.write(markdown)
          PY

      - name: Bereinigtes Diagnoseergebnis bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: husqvarna-lesetest-${{ github.run_number }}
          path: generated/husqvarna/husqvarna_read_test.json
          if-no-files-found: error
          retention-days: 7
