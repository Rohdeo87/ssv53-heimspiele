name: SSV53 Dynamische Sonderbelegung installieren V1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Exakt SSV53-SPECIAL-OCCUPANCY-INSTALL eingeben"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ssv53-special-occupancy-installer
  cancel-in-progress: false

jobs:
  install:
    name: Azure-Sonderbelegung sicher installieren
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      MIGRATION_BRANCH: feature/azure-mower-migration
      RESOURCE_GROUP: rg-ssv53-platzpflege-prod
      FUNCTION_APP: func-ssv53platzpflege-prod-q7kbw54s
      ADMIN_FUNCTION: ssv53_occupancy_admin
      ADMIN_KEY_NAME: ssv53-occupancy-command
      ALLOWED_SENDER: thomas_rohde@outlook.de
      PATCH_B64: 

    steps:
      - name: Explizite Freigabe und Azure-Variablen prüfen
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CLIENT_ID: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "$MIGRATION_BRANCH" ] || {
            echo "Installer darf nur vom Branch $MIGRATION_BRANCH gestartet werden." >&2
            exit 1
          }
          [ "$CONFIRMATION" = "SSV53-SPECIAL-OCCUPANCY-INSTALL" ] || {
            echo "Explizite Installationsbestätigung fehlt." >&2
            exit 1
          }
          for variable in CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            [ -n "${!variable:-}" ] || {
              echo "Erforderliche GitHub-Variable $variable fehlt." >&2
              exit 1
            }
          done

      - name: Aktuellen Migrationsstand laden
        uses: actions/checkout@v7
        with:
          ref: feature/azure-mower-migration
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dynamische Sonderbelegung idempotent einbauen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os

          code = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(
              compile(code, "ssv53-special-occupancy-installer", "exec"),
              {"__name__": "__main__"},
          )
          PY

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Syntax und vollständigen Python-Testbestand prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            function_app.py \
            order_mail.py \
            special_occupancy.py \
            training_cancellations.py \
            occupancy \
            mower \
            scripts
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: FULL_FAILSAFE-Produktionspaket bauen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          python scripts/build_azure_full_failsafe_package.py \
            --repository-root . \
            --output dist/ssv53-platzpflege-special-occupancy.zip \
            | tee dist/special-occupancy-package.json

      - name: Paket und Sicherheitsumfang hart prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import zipfile

          path = "dist/ssv53-platzpflege-special-occupancy.zip"
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              required = {
                  "function_app.py",
                  "order_mail.py",
                  "special_occupancy.py",
                  "training_cancellations.py",
                  "occupancy/config.json",
                  "occupancy/service.py",
                  "mower/full_failsafe.py",
                  "mower/full_mower.py",
                  "mower/husqvarna_actions.py",
                  "mower/husqvarna_start_actions.py",
                  "mower/hydrawise_actions.py",
                  "package-manifest.json",
              }
              missing = required - names
              assert not missing, f"Paketdateien fehlen: {sorted(missing)}"

              manifest = json.loads(
                  archive.read("package-manifest.json").decode("utf-8")
              )
              assert (
                  manifest["safety_stage"]
                  == "FULL_FAILSAFE_7_ZONES_150_MIN_ADAPTIVE_SHADOW_LOCKED"
              )
              assert manifest["park_write_gate_required"] is True
              assert manifest["start_write_gate_required"] is True
              assert manifest["irrigation_write_gate_required"] is True
              assert manifest["dynamic_special_occupancy_implemented"] is True
              assert manifest["dynamic_special_occupancy_fail_closed"] is True

              joined = b"\n".join(
                  archive.read(name)
                  for name in names
                  if name.endswith(".py")
              )
              assert b'route="occupancy-admin"' in joined
              assert b'auth_level=func.AuthLevel.FUNCTION' in joined
              assert b'PARTITION_KEY = "special-occupancy"' in joined

          print("FULL_FAILSAFE-Paket mit Sonderbelegung ist sicher geprüft.")
          PY

      - name: Geprüften Quellstand im Migrationsbranch sichern
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add \
            function_app.py \
            special_occupancy.py \
            tests/test_special_occupancy.py \
            mower/dry_run.py \
            mower/full_failsafe.py \
            mower/full_mower.py \
            scripts/build_azure_source_package.py \
            scripts/build_azure_park_only_package.py \
            scripts/build_azure_full_mower_package.py \
            scripts/build_azure_full_failsafe_package.py

          if git diff --cached --quiet; then
            echo "Quellstand war bereits vollständig installiert."
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add dynamic Azure special occupancy"
            git push origin HEAD:feature/azure-mower-migration
          fi

      - name: Per OIDC mit Azure anmelden
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ziel-Function und bestehende Laufzeiteinstellungen prüfen
        shell: bash
        run: |
          set -euo pipefail
          az account show --output none
          az functionapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --output none

          az functionapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --output json \
            > /tmp/appsettings-before.json
          test -s /tmp/appsettings-before.json

          python - <<'PY'
          import json
          rows = json.load(open("/tmp/appsettings-before.json", encoding="utf-8"))
          values = {row["name"]: str(row.get("value", "")) for row in rows}
          required = (
              "SSV53_STORAGE_ACCOUNT_URL",
              "SSV53_STATE_TABLE_NAME",
          )
          missing = [key for key in required if not values.get(key)]
          if missing:
              raise SystemExit(
                  "Vorhandene Azure-Table-Konfiguration fehlt: "
                  + ", ".join(missing)
              )
          client_id = (
              values.get("SSV53_STATE_MANAGED_IDENTITY_CLIENT_ID")
              or values.get("AzureWebJobsStorage__clientId")
          )
          if not client_id:
              raise SystemExit(
                  "Managed Identity für Azure Table ist nicht konfiguriert."
              )
          print("Bestehender Azure-Table-Store ist vollständig konfiguriert.")
          PY

      - name: Aktuellen FULL_FAILSAFE-Code deployen
        shell: bash
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --src dist/ssv53-platzpflege-special-occupancy.zip \
            --build-remote true \
            --timeout 900 \
            --output none

      - name: Beweisen dass Deployment keine Appsettings geändert hat
        shell: bash
        run: |
          set -euo pipefail
          az functionapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --output json \
            > /tmp/appsettings-after-deploy.json

          python - <<'PY'
          import json

          def values(path):
              rows = json.load(open(path, encoding="utf-8"))
              return {
                  str(row["name"]): str(row.get("value", ""))
                  for row in rows
              }

          before = values("/tmp/appsettings-before.json")
          after = values("/tmp/appsettings-after-deploy.json")
          if before != after:
              changed = sorted(
                  key
                  for key in set(before) | set(after)
                  if before.get(key) != after.get(key)
              )
              raise SystemExit(
                  "Deployment hat unerwartet Azure-Appsettings verändert: "
                  + ", ".join(changed)
              )
          print("Alle bestehenden Azure-Appsettings sind unverändert.")
          PY

      - name: Registrierung des Admin-Endpunkts abwarten
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 30); do
            if az functionapp function show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --function-name "$ADMIN_FUNCTION" \
              --output none 2>/dev/null
            then
              found=true
              break
            fi
            sleep 5
          done
          [ "$found" = "true" ] || {
            echo "occupancy-admin wurde nach dem Deployment nicht registriert." >&2
            exit 1
          }

      - name: Dedizierten Function-Key sicher bereitstellen
        shell: bash
        run: |
          set -euo pipefail

          KEYS_JSON="$(
            az functionapp function keys list \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --function-name "$ADMIN_FUNCTION" \
              --output json
          )"
          export KEYS_JSON

          FUNCTION_KEY="$(
            python - <<'PY'
          import json
          import os
          values = json.loads(os.environ["KEYS_JSON"])
          print(values.get("ssv53-occupancy-command", ""))
          PY
          )"

          if [ -z "$FUNCTION_KEY" ]; then
            FUNCTION_KEY="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )"
            az functionapp function keys set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --function-name "$ADMIN_FUNCTION" \
              --key-name "$ADMIN_KEY_NAME" \
              --key-value "$FUNCTION_KEY" \
              --output none
          fi

          [ -n "$FUNCTION_KEY" ]
          echo "::add-mask::$FUNCTION_KEY"
          printf '%s' "$FUNCTION_KEY" > /tmp/occupancy-function-key
          chmod 600 /tmp/occupancy-function-key
          echo "Dedizierter occupancy-admin-Key ist vorhanden."

      - name: Bestehende Herbst-/Weihnachtssperren in Azure übernehmen
        shell: bash
        run: |
          set -euo pipefail

          HOST="$(
            az functionapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --query defaultHostName \
              --output tsv
          )"
          [ -n "$HOST" ]
          FUNCTION_KEY="$(cat /tmp/occupancy-function-key)"

          python - <<'PY'
          import json

          commands = [
              {
                  "commandId": "migration-herbstkino-2026-10-03-v1",
                  "action": "upsert",
                  "event": {
                      "id": "sperre-herbstkino-2026-10-03",
                      "title": "Herbstkino – Kunstrasen gesperrt",
                      "start": "2026-10-03T00:00:00+02:00",
                      "end": "2026-10-04T00:00:00+02:00",
                      "resourceId": "kunstrasen",
                      "area": "vorne & hinten",
                      "description": (
                          "Kunstrasen ganztägig wegen Herbstkino gesperrt."
                      ),
                      "suppressTraining": True,
                      "mowerBufferBeforeMinutes": 30,
                      "mowerBufferAfterMinutes": 30,
                  },
              },
              {
                  "commandId": "migration-weihnachtssingen-2026-12-18-v1",
                  "action": "upsert",
                  "event": {
                      "id": "sperre-weihnachtssingen-2026-12-18",
                      "title": "Weihnachtssingen – Kunstrasen gesperrt",
                      "start": "2026-12-18T00:00:00+01:00",
                      "end": "2026-12-19T00:00:00+01:00",
                      "resourceId": "kunstrasen",
                      "area": "vorne & hinten",
                      "description": (
                          "Kunstrasen ganztägig wegen Weihnachtssingen gesperrt."
                      ),
                      "suppressTraining": True,
                      "mowerBufferBeforeMinutes": 30,
                      "mowerBufferAfterMinutes": 30,
                  },
              },
          ]

          for index, command in enumerate(commands, start=1):
              with open(
                  f"/tmp/special-command-{index}.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(command, handle, ensure_ascii=False)
          PY

          for file in /tmp/special-command-*.json; do
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --header "x-functions-key: $FUNCTION_KEY" \
              --data @"$file" \
              "https://${HOST}/api/occupancy-admin" \
              > "${file}.response"

            python - "$file.response" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload.get("ok") is True, payload
          print(
              "Azure-Sonderbelegung gespeichert:",
              payload.get("event", {}).get("title"),
          )
          PY
          done

      - name: Dynamische Sonderbelegungen erst nach erfolgreicher Migration aktivieren
        shell: bash
        run: |
          set -euo pipefail
          az functionapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --settings \
              SSV53_SPECIAL_OCCUPANCY_ENABLED=true \
              SSV53_OCCUPANCY_COMMAND_ALLOWED_SENDER="$ALLOWED_SENDER" \
            --output none

      - name: Nur die zwei neuen Appsettings als Änderung zulassen
        shell: bash
        run: |
          set -euo pipefail
          az functionapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --output json \
            > /tmp/appsettings-final.json

          python - <<'PY'
          import json

          def values(path):
              rows = json.load(open(path, encoding="utf-8"))
              return {
                  str(row["name"]): str(row.get("value", ""))
                  for row in rows
              }

          before = values("/tmp/appsettings-before.json")
          final = values("/tmp/appsettings-final.json")

          allowed = {
              "SSV53_SPECIAL_OCCUPANCY_ENABLED",
              "SSV53_OCCUPANCY_COMMAND_ALLOWED_SENDER",
          }
          changed_existing = sorted(
              key
              for key in before
              if key not in allowed
              and before.get(key) != final.get(key)
          )
          removed = sorted(key for key in before if key not in final)
          if changed_existing or removed:
              raise SystemExit(
                  "Bestehende Azure-Appsettings wurden verändert/entfernt: "
                  + ", ".join(sorted(set(changed_existing + removed)))
              )
          assert final.get("SSV53_SPECIAL_OCCUPANCY_ENABLED", "").lower() == "true"
          assert (
              final.get("SSV53_OCCUPANCY_COMMAND_ALLOWED_SENDER", "").lower()
              == "thomas_rohde@outlook.de"
          )
          print(
              "Mäher-, Beregnungs-, Mail- und sonstige bestehende "
              "Appsettings sind unverändert."
          )
          PY

      - name: Öffentliche Belegung live prüfen
        shell: bash
        run: |
          set -euo pipefail

          HOST="$(
            az functionapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --query defaultHostName \
              --output tsv
          )"

          fetch_live() {
            local url="$1"
            local output="$2"
            local ok=false
            for attempt in $(seq 1 30); do
              if curl \
                --fail \
                --silent \
                --show-error \
                "$url" \
                > "$output"
              then
                ok=true
                break
              fi
              sleep 5
            done
            [ "$ok" = "true" ]
          }

          fetch_live \
            "https://${HOST}/api/occupancy?start=2026-10-03&end=2026-10-04&season=Sommer" \
            /tmp/herbstkino-live.json

          fetch_live \
            "https://${HOST}/api/occupancy?start=2026-12-18&end=2026-12-19&season=Winter" \
            /tmp/weihnachtssingen-live.json

          python - <<'PY'
          import json

          october = json.load(
              open("/tmp/herbstkino-live.json", encoding="utf-8")
          )
          december = json.load(
              open("/tmp/weihnachtssingen-live.json", encoding="utf-8")
          )

          for payload in (october, december):
              special = payload.get("special_occupancy", {})
              assert special.get("enabled") is True, special
              assert special.get("available") is True, special
              assert special.get("fail_closed") is False, special
              assert special.get("count") == 1, special

          october_ids = [
              item.get("id")
              for item in october.get("events", [])
          ]
          december_ids = [
              item.get("id")
              for item in december.get("events", [])
          ]

          assert (
              october_ids.count(
                  "one-off:sperre-herbstkino-2026-10-03"
              )
              == 1
          )
          assert (
              december_ids.count(
                  "one-off:sperre-weihnachtssingen-2026-12-18"
              )
              == 1
          )

          december_training = [
              item
              for item in december.get("events", [])
              if item.get("source") == "training"
              and item.get("resourceId") == "kunstrasen"
              and str(item.get("start", "")).startswith("2026-12-18")
          ]
          assert not december_training, december_training

          print(
              "LIVE OK: Herbstkino und Weihnachtssingen kommen aus "
              "dem dynamischen Azure-Sonderbelegungsstore."
          )
          PY

      - name: Sicherheitszusammenfassung
        if: always()
        shell: bash
        run: |
          {
            echo "# SSV53 Dynamische Sonderbelegung"
            echo
            echo "- Dynamischer Speicher: **Azure Table / eigene Partition**"
            echo "- Admin-Endpunkt: **Function-Key geschützt**"
            echo "- Bestehende Appsettings beim Code-Deploy: **unverändert**"
            echo "- Neue Appsettings: **nur Sonderbelegungs-Feature + erlaubter Absender**"
            echo "- Kunstrasen Herbstkino: **nach Azure migriert**"
            echo "- Kunstrasen Weihnachtssingen: **nach Azure migriert**"
            echo "- Rasen-Sonderbelegungen: **Mäherplanung fail-closed integriert**"
            echo "- Google Kalender: **nicht verwendet**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure-Sitzung beenden
        if: always()
        shell: bash
        run: |
          rm -f /tmp/occupancy-function-key
          az logout || true
