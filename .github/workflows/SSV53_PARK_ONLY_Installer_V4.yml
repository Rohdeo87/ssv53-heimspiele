name: Einmalig - PARK_ONLY Stufe vorbereiten V4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssv53-park-only-installer-v4
  cancel-in-progress: false

jobs:
  install:
    name: PARK_ONLY V4 sicher installieren und testen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Azure-Migrationsbranch laden
        uses: actions/checkout@v7
        with:
          ref: feature/azure-mower-migration
          fetch-depth: 0

      - name: PARK_ONLY V4 Änderungspaket anwenden
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          code = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code, "park-only-v4-installer", "exec"), {"__name__": "__main__"})
          PY

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Gesamte Testsuite ausführen
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q mower function_app.py scripts
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Read-only und PARK_ONLY Pakete getrennt bauen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          python scripts/build_azure_source_package.py \
            --output dist/read-only-source.zip
          python scripts/build_azure_park_only_package.py \
            --output dist/park-only-source.zip

      - name: Sicherheitsgrenzen hart prüfen
        shell: bash
        run: |
          set -euo pipefail

          # Bestehender Read-only Adapter bleibt unangetastet.
          if grep -Fq '/actions' mower/husqvarna.py; then
            echo "Read-only Husqvarna-Modul enthält unerwartet Schreiblogik." >&2
            exit 1
          fi

          # Schreiblogik ist auf genau einen dedizierten PARK-Adapter begrenzt.
          ACTION_FILES="$(grep -RIl --include='*.py' '/actions' mower || true)"
          if [ "$ACTION_FILES" != "mower/husqvarna_actions.py" ]; then
            echo "Action-Endpunkt ist nicht exakt isoliert:" >&2
            echo "$ACTION_FILES" >&2
            exit 1
          fi

          grep -Fq 'ParkUntilFurtherNotice' mower/husqvarna_actions.py
          grep -Fq 'ENABLE_PARK_COMMANDS' mower/runtime.py
          grep -Fq 'class AzureTableStateStore' mower/state_store.py

          if grep -R --line-number --include='*.py' -E 'ResumeSchedule|StartInWorkArea|def start_|"type"[[:space:]]*:[[:space:]]*"Start"' mower; then
            echo "Automatische Startfunktion gefunden – Abbruch." >&2
            exit 1
          fi

          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile("dist/read-only-source.zip") as z:
              m = json.loads(z.read("package-manifest.json"))
              assert m["safety_stage"] == "DRY_RUN_READ_ONLY"
              assert "mower/husqvarna_actions.py" not in z.namelist()
          with zipfile.ZipFile("dist/park-only-source.zip") as z:
              m = json.loads(z.read("package-manifest.json"))
              assert m["safety_stage"] == "PARK_ONLY_CAPABLE_LOCKED"
              assert m["automatic_start_implemented"] is False
              assert "mower/husqvarna_actions.py" in z.namelist()
              assert "mower/park_only.py" in z.namelist()
          print("Beide Paketstufen sauber getrennt.")
          PY

      - name: Nur normale Repository-Dateien committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Absichtlich KEINE .github/workflows-Datei verändern/committen.
          git add requirements.txt mower scripts tests

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
            exit 0
          fi

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Workflow-Datei würde committed – Sicherheitsabbruch." >&2
            exit 1
          fi

          git commit -m "PARK_ONLY Stufe V3 sicher vorbereiten"
          git push origin HEAD:feature/azure-mower-migration

      - name: Ergebnis zusammenfassen
        shell: bash
        run: |
          {
            echo "# PARK_ONLY V4 vorbereitet"
            echo
            echo "- Gesamte Testsuite: **bestanden**"
            echo "- Bestehendes Read-only Paket: **unverändert und weiter schreibgeschützt**"
            echo "- PARK_ONLY Paket: **separat gebaut und geprüft**"
            echo "- Park-Endpunkt: **nur in mower/husqvarna_actions.py**"
            echo "- Automatischer Start: **nicht implementiert**"
            echo "- Doppelgate: **CONTROL_MODE=PARK_ONLY + ENABLE_PARK_COMMANDS=true**"
            echo "- Persistenter Dedupe-State: **vor Parkbefehl erforderlich**"
            echo "- Workflow-Dateien geändert: **nein**"
            echo "- Azure aktiviert: **noch nein**"
            echo "- Mäher angesprochen: **nein**"
          } >> "$GITHUB_STEP_SUMMARY"
