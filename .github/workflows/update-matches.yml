name: SSV53 Heimspiele aktualisieren

on:
  workflow_dispatch:
    inputs:
      skip_start_delay:
        description: "Zufällige Startwartezeit bei diesem manuellen Lauf überspringen"
        required: false
        type: boolean
        default: true
      allow_destructive_change:
        description: "Massiven Spielverlust nach eigener Prüfung ausnahmsweise freigeben"
        required: false
        type: boolean
        default: false
      persist_test_results:
        description: "Ergebnisse auch speichern, wenn der Lauf nicht auf main gestartet wurde"
        required: false
        type: boolean
        default: false
  schedule:
    # GitHub-Cron läuft in UTC. Diese vier Startpunkte liegen sowohl bei
    # Winter- als auch Sommerzeit sicher zwischen 06:00 und 22:00 Uhr Berlin.
    # Vor dem eigentlichen Abruf folgt zusätzlich eine zufällige Wartezeit.
    - cron: "20 5 * * *"
    - cron: "20 10 * * *"
    - cron: "20 15 * * *"
    - cron: "20 19 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: ssv53-match-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Dateien laden
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Berliner Abruffenster prüfen
        id: timing
        shell: bash
        run: python schedule_guard.py prepare --config config.json

      - name: Startzeit gegebenenfalls zufällig verschieben
        if: steps.timing.outputs.should_run == 'true'
        shell: bash
        env:
          SKIP_START_DELAY: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_start_delay }}
        run: |
          if [ "$SKIP_START_DELAY" = "true" ]; then
            echo "Manueller Testlauf: zufällige Startwartezeit wird übersprungen."
          else
            echo "Der Abruf startet nach ${{ steps.timing.outputs.delay_seconds }} Sekunden."
            sleep "${{ steps.timing.outputs.delay_seconds }}"
          fi

      - name: Abruffenster nach Wartezeit erneut prüfen
        id: timing_confirm
        if: steps.timing.outputs.should_run == 'true'
        shell: bash
        run: python schedule_guard.py confirm --config config.json

      - name: Abhängigkeiten installieren
        if: steps.timing_confirm.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Tests ausführen
        if: steps.timing_confirm.outputs.should_run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Letzten veröffentlichten Stand sichern
        if: steps.timing_confirm.outputs.should_run == 'true'
        shell: bash
        run: |
          mkdir -p .run-state
          if [ -f public/matches.json ]; then
            cp public/matches.json .run-state/previous-matches.json
          else
            echo '{"matches": []}' > .run-state/previous-matches.json
          fi

      - name: Heimspiele zurückhaltend abrufen
        id: scrape
        if: steps.timing_confirm.outputs.should_run == 'true'
        continue-on-error: true
        run: >-
          python poc_scraper.py
          --config config.json
          --output generated
          --state state/request_state.json
          --team-registry state/team_registry.json
          --verbose

      - name: Veröffentlichbaren Feed erstellen
        id: feed
        if: steps.scrape.outcome == 'success'
        run: python create_feed.py --input generated --output public

      - name: Änderungen auswerten und Sicherheitsgrenze prüfen
        id: changes
        if: steps.feed.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          ALLOW_DESTRUCTIVE_CHANGE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_destructive_change }}
        run: |
          ARGS=(
            --before .run-state/previous-matches.json
            --after public/matches.json
            --json generated/change_report.json
            --markdown generated/change_report.md
            --public-json public/change_report.json
          )
          if [ "$ALLOW_DESTRUCTIVE_CHANGE" = "true" ]; then
            ARGS+=(--allow-destructive)
          fi
          python report_changes.py "${ARGS[@]}"

      - name: Testlauf in der Zusammenfassung kennzeichnen
        if: ${{ always() && steps.timing_confirm.outputs.should_run == 'true' && github.ref_name != github.event.repository.default_branch }}
        shell: bash
        run: |
          {
            echo ""
            echo "> Dieser Lauf wurde auf Branch \`${GITHUB_REF_NAME}\` ausgeführt."
            if [ "${{ inputs.persist_test_results }}" = "true" ]; then
              echo "> Die erzeugten Daten werden auf diesem Test-Branch gespeichert."
            else
              echo "> Reiner Testlauf: Es werden keine erzeugten Daten committed oder veröffentlicht."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnoseergebnis bereitstellen
        if: ${{ always() && steps.timing_confirm.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: dfbnet-diagnose-${{ github.run_number }}
          path: generated
          if-no-files-found: ignore
          retention-days: 7

      - name: Daten und Schutzstatus konfliktfrei speichern
        id: persist
        if: ${{ always() && steps.timing_confirm.outputs.should_run == 'true' && (github.ref_name == github.event.repository.default_branch || inputs.persist_test_results == true) }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH="$GITHUB_REF_NAME"
          TEMP_DIR="$(mktemp -d)"
          mkdir -p "$TEMP_DIR/state"
          cp state/request_state.json "$TEMP_DIR/state/request_state.json"

          SAVE_PUBLIC=false
          SAVE_REGISTRY=false
          if [ "${{ steps.feed.outcome }}" = "success" ] && [ "${{ steps.changes.outcome }}" = "success" ]; then
            cp -a public "$TEMP_DIR/public"
            SAVE_PUBLIC=true
          fi
          if [ "${{ steps.scrape.outcome }}" = "success" ] && [ -f generated/team_registry.json ]; then
            cp generated/team_registry.json "$TEMP_DIR/state/team_registry.json"
            SAVE_REGISTRY=true
          fi

          # Während des Laufs kann neuer Code auf denselben Branch gelangen.
          # Deshalb zuerst auf den neuesten Branch-Stand wechseln und danach
          # ausschließlich die erzeugten Daten zurückkopieren.
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"

          mkdir -p state
          cp "$TEMP_DIR/state/request_state.json" state/request_state.json
          git add state/request_state.json

          if [ "$SAVE_REGISTRY" = "true" ]; then
            cp "$TEMP_DIR/state/team_registry.json" state/team_registry.json
            git add state/team_registry.json
          fi

          if [ "$SAVE_PUBLIC" = "true" ]; then
            rm -rf public
            cp -a "$TEMP_DIR/public" public
            git add public
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Platzspiele, Änderungsbericht und Abrufschutz aktualisiert"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Bei Handlungsbedarf GitHub-Issue erzeugen
        id: notify
        if: ${{ always() && steps.timing_confirm.outputs.should_run == 'true' && github.ref_name == github.event.repository.default_branch }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          FEED_OUTCOME: ${{ steps.feed.outcome }}
          CHANGES_OUTCOME: ${{ steps.changes.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: |
          set -euo pipefail
          ARGS=(
            --repository "${{ github.repository }}"
            --run-url "$RUN_URL"
            --scrape-outcome "$SCRAPE_OUTCOME"
            --feed-outcome "$FEED_OUTCOME"
            --changes-outcome "$CHANGES_OUTCOME"
            --persist-outcome "$PERSIST_OUTCOME"
          )
          if [ -f generated/change_report.json ]; then
            ARGS+=(--report generated/change_report.json)
          fi
          python notify_changes.py "${ARGS[@]}"

      - name: Laufstatus abschließend prüfen
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.timing.outputs.should_run }}" != "true" ]; then
            echo "Kein Abruf: außerhalb des erlaubten Zeitfensters oder zu nah an 22:00 Uhr."
            exit 0
          fi
          if [ "${{ steps.timing_confirm.outputs.should_run }}" != "true" ]; then
            echo "Kein Abruf: Das Zeitfenster endete während der zufälligen Wartezeit."
            exit 0
          fi
          if [ "${{ steps.scrape.outcome }}" != "success" ]; then
            echo "Der Abruf ist fehlgeschlagen. Der letzte veröffentlichte Feed bleibt unverändert." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ steps.feed.outcome }}" != "success" ]; then
            echo "Der Feed konnte nicht sicher erstellt werden. Der letzte veröffentlichte Feed bleibt unverändert." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ steps.changes.outcome }}" != "success" ]; then
            echo "Die Änderungskontrolle hat die Veröffentlichung blockiert. Der letzte veröffentlichte Feed bleibt unverändert." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if { [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ] || [ "${{ inputs.persist_test_results }}" = "true" ]; } && [ "${{ steps.persist.outcome }}" != "success" ]; then
            echo "Die geprüften Daten konnten nicht sicher gespeichert oder veröffentlicht werden." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ] && [ "${{ steps.notify.outcome }}" != "success" ]; then
            echo "Der Spielabruf wurde verarbeitet, aber die GitHub-Benachrichtigung ist fehlgeschlagen." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
