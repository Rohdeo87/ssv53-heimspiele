name: "Einmalig: Azure-Migration Phase 2 Read-only vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Read-only Live-Dry-Run in Azure-Branch einbauen
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Phase 2 im Migrationsbranch installieren und testen
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="feature/azure-mower-migration"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Der erwartete Migrationsbranch $BRANCH fehlt." >&2
            exit 1
          fi

          git switch "$BRANCH"
          git pull --ff-only origin "$BRANCH"

          python - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path

          files = {
              'mower/runtime.py': '',
              'mower/husqvarna.py': '',
              'mower/decision.py': '',
              'mower/dry_run.py': '',
              'mower/controller.py': '',
              'tests/test_mower_decision.py': '',
              'tests/test_husqvarna_readonly.py': '',
              'tests/test_mower_controller_phase2.py': '',
              'local.settings.example.json': '',
              'AZURE_MIGRATION.md': '',
          }

          for relative_path, encoded_content in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded_content))
              print(f'Erzeugt/aktualisiert: {target}')
          PY

          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m compileall -q mower function_app.py
          python -m unittest discover -s tests -p "test_*.py" -v

          python - <<'PY'
          from pathlib import Path

          source = Path("mower/husqvarna.py").read_text(encoding="utf-8")
          if "/actions" in source or "send_mower_action" in source:
              raise SystemExit(
                  "Sicherheitsprüfung fehlgeschlagen: "
                  "Das Phase-2-Husqvarna-Modul enthält einen Aktions-Endpunkt."
              )

          controller = Path("mower/controller.py").read_text(encoding="utf-8")
          if "ensure_heartbeat_only_mode" not in controller:
              raise SystemExit(
                  "Sicherheitsprüfung fehlgeschlagen: "
                  "Die Sperre für Live-Steuermodi fehlt."
              )

          settings = Path("local.settings.example.json").read_text(
              encoding="utf-8"
          )
          if '"CONTROL_MODE": "DRY_RUN"' not in settings:
              raise SystemExit("CONTROL_MODE ist nicht sicher vorbelegt.")
          if '"ENABLE_LIVE_READS": "false"' not in settings:
              raise SystemExit("Live-Abfragen sind nicht sicher deaktiviert.")

          print("Alle statischen Phase-2-Sicherheitsprüfungen bestanden.")
          PY

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add \
            mower/runtime.py \
            mower/husqvarna.py \
            mower/decision.py \
            mower/dry_run.py \
            mower/controller.py \
            tests/test_mower_decision.py \
            tests/test_husqvarna_readonly.py \
            tests/test_mower_controller_phase2.py \
            local.settings.example.json \
            AZURE_MIGRATION.md

          if git diff --cached --quiet; then
            echo "Phase 2 war bereits vollständig vorhanden."
          else
            git commit -m "Azure Phase 2 Read-only Live-Dry-Run vorbereiten"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Einmaligen Installer aus main entfernen
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          INSTALLER=".github/workflows/SSV53_Azure_Migration_Phase2_ReadOnly.yml"

          git switch main
          git pull --ff-only origin main
          rm -f "$INSTALLER"

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -A "$INSTALLER"
          if git diff --cached --quiet; then
            echo "Installer war bereits entfernt."
          else
            git commit -m "Einmaligen Azure-Phase-2-Installer entfernen"
            git push origin HEAD:main
          fi

      - name: Ergebnis zusammenfassen
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "# Azure-Migration Phase 2 vorbereitet"
            echo
            echo "- Branch: \`feature/azure-mower-migration\`"
            echo "- Husqvarna: ausschließlich lesender Zugriff"
            echo "- Hydrawise: ausschließlich lesender Zugriff"
            echo "- Entscheidungslogik aus dem Workflow in Python-Modul verschoben"
            echo "- Live-Abfragen standardmäßig deaktiviert"
            echo "- \`PARK_ONLY\`, \`FULL_MOWER\` und \`FULL_FAILSAFE\` weiterhin gesperrt"
            echo "- Alle Repository- und Sicherheitstests erfolgreich"
            echo "- Keine Gerätebefehle gesendet"
          } >> "$GITHUB_STEP_SUMMARY"
