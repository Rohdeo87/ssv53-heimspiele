name: "Einmalig: Azure-Migration Phase 1 vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Sicheren Azure-Branch und Heartbeat-Gerüst anlegen
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Migrationsbranch anlegen und Dateien erzeugen
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="feature/azure-mower-migration"
          INSTALLER=".github/workflows/SSV53_Azure_Migration_Phase1_Vorbereiten.yml"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Der Branch $BRANCH existiert bereits. Es wird nichts überschrieben." >&2
            exit 1
          fi

          git switch -c "$BRANCH"

          python - <<'PY'
          import base64
          from pathlib import Path

          files = {
              'mower/runtime.py': '',
              'mower/controller.py': '',
              'function_app.py': '',
              'tests/test_mower_runtime.py': '',
              'host.json': '',
              'local.settings.example.json': '',
              'requirements.txt': 'YXp1cmUtZnVuY3Rpb25zPj0xLjIxLDwyCg==',
              '.funcignore': 'LmdpdCoKLmdpdGh1Yi8KLnZzY29kZS8KLnZlbnYvCl9fcHljYWNoZV9fLwoqLnB5W2NvZF0KbG9jYWwuc2V0dGluZ3MuanNvbgpnZW5lcmF0ZWQvCnRlc3RzLwo=',
              'AZURE_MIGRATION.md': '',
              'azure_function/README.md': '',
          }

          for relative_path, encoded_content in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded_content))
              print(f"Erzeugt: {relative_path}")
          PY

          rm -f "$INSTALLER"

          python -m compileall -q mower function_app.py
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m json.tool host.json >/dev/null
          python -m json.tool local.settings.example.json >/dev/null

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add             .funcignore             AZURE_MIGRATION.md             azure_function/README.md             function_app.py             host.json             local.settings.example.json             requirements.txt             mower/controller.py             mower/runtime.py             tests/test_mower_runtime.py
          git add -A "$INSTALLER"

          git commit -m "Azure-Migration Phase 1 sicher vorbereiten"
          git push --set-upstream origin "$BRANCH"

      - name: Einmaligen Installer aus main entfernen
        shell: bash
        run: |
          set -euo pipefail

          INSTALLER=".github/workflows/SSV53_Azure_Migration_Phase1_Vorbereiten.yml"

          git switch main
          git pull --ff-only origin main
          rm -f "$INSTALLER"

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -A "$INSTALLER"
          if git diff --cached --quiet; then
            echo "Installer war auf main bereits entfernt."
          else
            git commit -m "Einmaligen Azure-Migrations-Installer entfernen"
            git push origin main
          fi

      - name: Ergebnis zusammenfassen
        shell: bash
        run: |
          {
            echo "# Azure-Migration Phase 1 vorbereitet"
            echo
            echo "- Branch: \`feature/azure-mower-migration\`"
            echo "- Bestehende Mähsteuerung auf \`main\`: unverändert"
            echo "- Azure-Betrieb: noch nicht bereitgestellt"
            echo "- Externe API-Aufrufe: keine"
            echo "- Gerätebefehle: technisch gesperrt"
            echo "- Neue Sicherheitstests: erfolgreich"
            echo
            echo "Nächster Schritt: Branch prüfen und die vorhandene Husqvarna-Entscheidungslogik in testbare Python-Module verschieben."
          } >> "$GITHUB_STEP_SUMMARY"
