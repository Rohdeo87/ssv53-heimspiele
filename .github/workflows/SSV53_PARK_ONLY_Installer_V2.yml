name: Einmalig - PARK_ONLY Stufe vorbereiten V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssv53-park-only-installer
  cancel-in-progress: false

jobs:
  install:
    name: PARK_ONLY V2 sicher installieren und testen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Azure-Migrationsbranch laden
        uses: actions/checkout@v7
        with:
          ref: feature/azure-mower-migration
          fetch-depth: 0

      - name: PARK_ONLY V2 Änderungspaket anwenden
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os

          code = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code, "park-only-v2-installer", "exec"), {"__name__": "__main__"})
          PY

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Gesamte Testsuite und Paketbau prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q mower function_app.py scripts
          python -m unittest discover -s tests -p "test_*.py" -v
          rm -rf dist
          mkdir -p dist
          python scripts/build_azure_source_package.py             --output dist/ssv53-platzpflege-source.zip

      - name: Sicherheitsgrenzen des Kandidaten hart prüfen
        shell: bash
        run: |
          set -euo pipefail

          if grep -Fq '/actions' mower/husqvarna.py; then
            echo "Read-only Modul mower/husqvarna.py enthält unerwartet einen Action-Endpunkt." >&2
            exit 1
          fi

          grep -Fq '/actions' mower/husqvarna_actions.py
          grep -Fq 'ParkUntilFurtherNotice' mower/husqvarna_actions.py
          grep -Fq 'ENABLE_PARK_COMMANDS' mower/runtime.py
          grep -Fq 'class AzureTableStateStore' mower/state_store.py
          grep -Fq 'PARK_ONLY_CAPABLE_LOCKED' scripts/build_azure_source_package.py

          ACTION_FILES="$(grep -RIl --include='*.py' '/actions' mower || true)"
          if [ "$ACTION_FILES" != "mower/husqvarna_actions.py" ]; then
            echo "Action-Endpunkt liegt nicht ausschließlich im dedizierten PARK-Adapter:" >&2
            echo "$ACTION_FILES" >&2
            exit 1
          fi

          if grep -R --line-number --include='*.py' -E 'ResumeSchedule|StartInWorkArea|def start_|"type"[[:space:]]*:[[:space:]]*"Start"' mower; then
            echo "Verbotene automatische Startfunktion im produktiven Mähercode gefunden." >&2
            exit 1
          fi

      - name: Änderungen auf Azure-Migrationsbranch committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt mower scripts tests .github/workflows/azure-package-build.yml

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
            exit 0
          fi

          git commit -m "PARK_ONLY Stufe V2 sicher vorbereiten"
          git push origin HEAD:feature/azure-mower-migration

      - name: Ergebnis zusammenfassen
        shell: bash
        run: |
          {
            echo "# PARK_ONLY V2 vorbereitet"
            echo
            echo "- Gesamte Testsuite: **bestanden**"
            echo "- Read-only Husqvarna-Modul: **weiterhin ohne Action-Endpunkt**"
            echo "- PARK-Action: **in separatem Adapter isoliert**"
            echo "- Automatischer Start: **nicht implementiert**"
            echo "- Doppelgate: **CONTROL_MODE=PARK_ONLY + ENABLE_PARK_COMMANDS=true**"
            echo "- Persistente Dedupe-Reservierung: **vor dem Parkbefehl**"
            echo "- Fehler-/State-Store-Probleme: **fail-closed**"
            echo "- Azure aktiviert: **noch nein**"
            echo "- Mäher angesprochen: **nein**"
          } >> "$GITHUB_STEP_SUMMARY"
