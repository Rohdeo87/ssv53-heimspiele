name: "Einmalig: Azure Post-Deployment-Prüfung V2 vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssv53-azure-postdeploy-v2-installer
  cancel-in-progress: false

jobs:
  install:
    name: Post-Deployment-Prüfung V2 vorbereiten
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Main laden
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Prüfworkflow im Migrationsbranch schreiben
        shell: bash
        env:
          WORKFLOW_B64: ""
        run: |
          set -euo pipefail
          git fetch origin feature/azure-mower-migration
          git checkout feature/azure-mower-migration
          git pull --ff-only origin feature/azure-mower-migration
          printf '%s' "$WORKFLOW_B64" | base64 -d > .github/workflows/azure-postdeploy-verify.yml
          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/azure-postdeploy-verify.yml
          if git diff --cached --quiet; then
            echo "Prüfworkflow bereits aktuell."
          else
            git commit -m "Azure Post-Deployment-Prüfung ergänzen"
            git push origin feature/azure-mower-migration
          fi

      - name: Sicheren Platzhalter auf main schreiben
        shell: bash
        env:
          PLACEHOLDER_B64: ""
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          printf '%s' "$PLACEHOLDER_B64" | base64 -d > .github/workflows/azure-postdeploy-verify.yml
          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/azure-postdeploy-verify.yml
          if git diff --cached --quiet; then
            echo "Platzhalter bereits aktuell."
          else
            git commit -m "Sicheren Platzhalter für Azure Post-Deployment-Prüfung ergänzen"
            git push origin main
          fi

  cleanup:
    name: Alte Installer aufräumen
    needs: install
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Main laden
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Installer entfernen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/SSV53_Azure_PostDeployment_Installer.yml
          rm -f .github/workflows/SSV53_Azure_PostDeployment_Installer_V2.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "Nichts aufzuräumen."
          else
            git commit -m "Einmalige Azure-Post-Deployment-Installer entfernen"
            git push origin main
          fi
