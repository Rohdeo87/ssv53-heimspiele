name: "Einmalig: Azure Phase 7 vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssv53-azure-phase7-installer
  cancel-in-progress: false

jobs:
  prepare:
    name: Alarmierung und dynamische Laufzeitdaten vorbereiten
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Azure-Migrationsbranch laden
        uses: actions/checkout@v7
        with:
          ref: feature/azure-mower-migration
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Branch aktualisieren
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin feature/azure-mower-migration

      - name: Phase 7 Dateien und Änderungen anwenden
        shell: bash
        env:
          CONFIG_SOURCE_B64: ""
          TEST_CONFIG_SOURCE_B64: ""
          PATCHER_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$CONFIG_SOURCE_B64" | base64 -d > mower/config_source.py
          printf '%s' "$TEST_CONFIG_SOURCE_B64" | base64 -d > tests/test_config_source.py
          printf '%s' "$PATCHER_B64" | base64 -d > /tmp/patch_phase7.py
          python /tmp/patch_phase7.py

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Vollständige Test-Suite ausführen
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q mower function_app.py scripts
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Bicep kompilieren und Sicherheitsgrenzen prüfen
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          az bicep build --file infra/main.bicep --outfile /tmp/ssv53-phase7-main.json
          python - <<'PY'
          import json
          from pathlib import Path
          template = json.loads(Path('/tmp/ssv53-phase7-main.json').read_text(encoding='utf-8'))
          serialized = json.dumps(template)
          required = (
              'Microsoft.Insights/actionGroups',
              'Microsoft.Insights/scheduledQueryRules',
              'runtime-config',
              'SSV53_DYNAMIC_CONFIG_ENABLED',
          )
          missing = [item for item in required if item not in serialized]
          if missing:
              raise SystemExit(f'Phase-7-Ressourcen fehlen im kompilierten Template: {missing}')
          if 'Microsoft.KeyVault/vaults/secrets' in serialized:
              raise SystemExit('Template darf weiterhin keine Geheimniswerte bereitstellen.')
          print('Phase-7-Bicep ist strukturell gültig.')
          PY

      - name: Azure-Quellpaket bauen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          python scripts/build_azure_source_package.py --output dist/ssv53-platzpflege-source.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/ssv53-platzpflege-source.zip') as zf:
              names = set(zf.namelist())
          if 'mower/config_source.py' not in names:
              raise SystemExit('config_source.py fehlt im Azure-Paket.')
          print('Dynamische Konfigurationsquelle ist im sicheren Paket enthalten.')
          PY

      - name: Änderungen committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mower/config_source.py mower/dry_run.py requirements.txt scripts/build_azure_source_package.py             tests/test_config_source.py tests/test_azure_infra.py infra/main.bicep             infra/main.parameters.example.json infra/PRE_DEPLOYMENT_DECISIONS.md             .github/workflows/azure-infra-what-if.yml
          if git diff --cached --quiet; then
            echo "Phase 7 ist bereits vollständig angewendet."
          else
            git commit -m "Azure Phase 7: Alarme und dynamische Laufzeitdaten"
            git push origin feature/azure-mower-migration
          fi

  cleanup:
    name: Einmaligen Phase-7-Installer entfernen
    needs: prepare
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: main laden
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Installer aus main entfernen
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/SSV53_Azure_Phase7_Installer.yml"
          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f "$FILE"
          if git diff --quiet; then
            echo "Installer bereits entfernt."
          else
            git add -A "$FILE"
            git commit -m "Einmaligen Azure-Phase-7-Installer entfernen"
            git push origin main
          fi
