name: "Einmalig: Stable Release 12.3 vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ssv53-release-12-3
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: release/12.3
      SELF_PATH: .github/workflows/prepare-release-12.3.yml

    steps:
      - name: Automatisierungstoken prüfen
        env:
          TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "SSV53_AUTOMATION_TOKEN fehlt."; exit 1; }

      - name: main laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}

      - name: Release-Branch vorbereiten
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B "$TARGET_BRANCH" origin/main
          rm -f "$SELF_PATH"

      - name: Versionsangaben und Release Notes aktualisieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "# SSV53 – FUSSBALL.DE-Platzbelegung PoC Version 12.2",
              "# SSV53 – FUSSBALL.DE-Platzbelegung PoC Version 12.3",
              1,
          )
          old_intro = (
              "Version 12.2 basiert auf Version 12 und löst die feste Mannschaftsliste "
              "aus Version 11 ab. Der Abruf erfolgt jetzt über den vereinsweiten Spielplan "
              "des Schönwalder SV 53. Dadurch werden auch Spiele von später neu "
              "hinzukommenden Vereinsmannschaften automatisch berücksichtigt, ohne dass "
              "ihre Mannschafts-ID vorher in `config.json` eingetragen werden muss."
          )
          new_intro = (
              "Version 12.3 ist der stabile Stand nach Version 12.2. Sie ergänzt den "
              "vereinsweiten, platzbasierten Abruf um einen mobilen Änderungsbericht, "
              "zusätzlichen Veröffentlichungsschutz und automatische GitHub-Issue-"
              "Benachrichtigungen. Abrufgrenzen, Terminauflösung, Platzregeln und "
              "60-Minuten-Puffer aus Version 12.2 bleiben unverändert."
          )
          if old_intro in readme:
              readme = readme.replace(old_intro, new_intro, 1)
          elif new_intro not in readme:
              raise RuntimeError("README-Einleitung konnte nicht aktualisiert werden.")

          release_section = """## Neu in Version 12.3

          - Neue, geänderte und entfernte Spiele erscheinen in der GitHub-Actions-Summary.
          - Unplausible Datenverluste blockieren die Veröffentlichung.
          - Branch-Testläufe veröffentlichen standardmäßig keine Daten.
          - Bei Spieländerungen, Blockierungen oder technischen Fehlern entstehen GitHub-Issues.
          - Identische Warnungen werden nicht mehrfach erstellt.
          - Technische Warnungen schließen sich nach erfolgreicher Erholung automatisch.
          - Erfolgreiche unveränderte Abrufe bleiben ohne Benachrichtigung.

          """
          if "## Neu in Version 12.3" not in readme:
              marker = new_intro + "\n\n"
              readme = readme.replace(marker, marker + release_section, 1)

          readme = readme.replace(
              "## Was Version 12.1 automatisch erkennt",
              "## Welche Spieldaten automatisch erkannt werden",
          )
          readme_path.write_text(readme.rstrip() + "\n", encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          section = """## Version 12.3

          - Mobiler Änderungsbericht in der GitHub-Actions-Summary.
          - Veröffentlichungsschutz bei leerem Folgefeed oder massivem Spielverlust.
          - Sichere, standardmäßig nicht veröffentlichende Branch-Testläufe.
          - GitHub-Issue-Benachrichtigungen bei Änderungen, Blockierungen und Fehlern.
          - Deduplizierung identischer Warnungen und automatische Erholung technischer Warnungen.
          - Separater Workflow für echte Testbenachrichtigungen.
          - Erweiterte Tests für Änderungsbericht und Benachrichtigungslogik.

          """
          if "## Version 12.3" not in changelog:
              changelog = changelog.replace("# Changelog\n\n", "# Changelog\n\n" + section, 1)
          changelog_path.write_text(changelog.rstrip() + "\n", encoding="utf-8")

          for filename in ("config.json", "config.example.json"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8").replace(
                  "SSV53-Belegungsplan-PoC/12.2",
                  "SSV53-Belegungsplan-PoC/12.3",
              )
              json.loads(text)
              path.write_text(text, encoding="utf-8")

          scraper_path = Path("poc_scraper.py")
          scraper = scraper_path.read_text(encoding="utf-8").replace(
              "SSV53-Belegungsplan-PoC/12.2",
              "SSV53-Belegungsplan-PoC/12.3",
          )
          scraper_path.write_text(scraper, encoding="utf-8")

          notes = """# Stable Release 12.3

          Version 12.3 erweitert den stabilen Abrufstand 12.2 um eine direkt auf dem Handy lesbare Änderungskontrolle und automatische GitHub-Benachrichtigungen.

          ## Neuerungen

          - Workflow-Summary für neue, geänderte und entfernte Platzspiele
          - Schutz vor leerem Folgefeed und massivem unplausiblem Spielverlust
          - sichere Testläufe auf Entwicklungsbranches
          - GitHub-Issues bei echtem Handlungsbedarf
          - keine doppelten identischen Warnungen
          - automatische Schließung technischer Warnungen nach erfolgreicher Erholung
          - keine Benachrichtigung bei unverändertem erfolgreichem Abruf

          ## Unveränderte Schutzgrenzen

          - höchstens zehn Requests pro Lauf
          - mindestens drei Sekunden Abstand
          - höchstens ein Retry bei Timeout oder HTTP 502/503/504
          - sofortiger Stopp bei HTTP 429
          - dauerhafte Sperre bei HTTP 403, 406 oder erkannter Sicherheitsseite
          - vollständige Qualitätsprüfung vor jeder Veröffentlichung
          - 60 Minuten Belegungspuffer vor und nach jedem Spiel
          """
          Path("RELEASE_NOTES_12.3.md").write_text(
              notes.replace("          ", "").rstrip() + "\n",
              encoding="utf-8",
          )

          assert "Version 12.3" in readme_path.read_text(encoding="utf-8")
          assert "## Version 12.3" in changelog_path.read_text(encoding="utf-8")
          assert "SSV53-Belegungsplan-PoC/12.3" in scraper_path.read_text(encoding="utf-8")
          PY

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tests und Kompilierung
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m compileall -q .

      - name: Commit und Push
        run: |
          set -euo pipefail
          git add README.md CHANGELOG.md RELEASE_NOTES_12.3.md \
            config.json config.example.json poc_scraper.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Stable Release 12.3 vorbereiten"
          git push --force-with-lease origin "HEAD:$TARGET_BRANCH"

      - name: Draft-Pull-Request erstellen
        id: pr
        env:
          GH_TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$TARGET_BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url // ""')"

          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$TARGET_BRANCH" \
              --base main \
              --draft \
              --title "Stable Release 12.3 vorbereiten" \
              --body-file RELEASE_NOTES_12.3.md)"
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Zusammenfassung
        if: always()
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          {
            echo "## Stable Release 12.3"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Release-Kandidat 12.3 wurde vorbereitet."
              echo ""
              echo "- Pull Request: $PR_URL"
              echo "- \`main\` ist noch unverändert."
              echo "- Tests und Python-Kompilierung waren erfolgreich."
              echo "- Tag und GitHub-Release folgen erst nach dem Merge."
            else
              echo "❌ Release-Vorbereitung fehlgeschlagen."
              echo "- Der produktive Stand auf \`main\` wurde nicht verändert."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Einmal-Workflow aus main entfernen
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          if [ -f "$SELF_PATH" ]; then
            rm "$SELF_PATH"
            git add "$SELF_PATH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Einmalige Release-Vorbereitung entfernen"
            git push origin main
          fi
