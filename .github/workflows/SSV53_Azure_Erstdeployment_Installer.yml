name: "Einmalig: Azure Erstdeployment vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssv53-azure-firstdeploy-installer
  cancel-in-progress: false

jobs:
  prepare:
    name: Erstdeployment sicher vorbereiten
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Azure-Migrationsbranch laden
        uses: actions/checkout@v7
        with:
          ref: feature/azure-mower-migration
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Branch aktualisieren
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin feature/azure-mower-migration

      - name: Sichere Infrastrukturparameter ergänzen
        shell: bash
        env:
          PATCH_SCRIPT_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_SCRIPT_B64" | base64 -d > /tmp/phase9_patch.py
          python /tmp/phase9_patch.py

      - name: Deployment-Workflow und Tests anlegen
        shell: bash
        env:
          DEPLOY_B64: ""
          TEST_B64: ""
        run: |
          set -euo pipefail
          mkdir -p .github/workflows tests
          printf '%s' "$DEPLOY_B64" | base64 -d > .github/workflows/azure-first-deploy.yml
          printf '%s' "$TEST_B64" | base64 -d > tests/test_azure_first_deploy.py

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Gesamte Testsuite und Bicep prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m compileall -q mower function_app.py scripts
          python -m unittest discover -s tests -p "test_*.py" -v
          az bicep install
          az bicep build --file infra/main.bicep --outfile /tmp/ssv53-firstdeploy-main.json

      - name: Änderungen in Migrationsbranch committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add             infra/main.bicep             infra/main.parameters.example.json             tests/test_azure_infra.py             tests/test_azure_first_deploy.py             .github/workflows/azure-first-deploy.yml
          if git diff --cached --quiet; then
            echo "Erstdeployment-Stufe bereits vorbereitet."
          else
            git commit -m "Azure: sichere Erstdeployment-Stufe vorbereiten"
            git push origin feature/azure-mower-migration
          fi

      - name: Main laden
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Sicheren Platzhalter auf main anlegen
        shell: bash
        env:
          STUB_B64: ""
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          printf '%s' "$STUB_B64" | base64 -d > .github/workflows/azure-first-deploy.yml
          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/azure-first-deploy.yml
          if git diff --cached --quiet; then
            echo "Platzhalter bereits vorhanden."
          else
            git commit -m "Sicheren Platzhalter für Azure-Erstdeployment ergänzen"
            git push origin main
          fi

  cleanup:
    name: Einmaligen Erstdeployment-Installer entfernen
    needs: prepare
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Main laden
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - name: Installer entfernen
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/SSV53_Azure_Erstdeployment_Installer.yml"
          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f "$FILE"
          if git diff --quiet; then
            echo "Installer bereits entfernt."
          else
            git add -A "$FILE"
            git commit -m "Einmaligen Azure-Erstdeployment-Installer entfernen"
            git push origin main
          fi
