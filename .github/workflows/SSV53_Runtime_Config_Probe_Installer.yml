name: "Einmalig: Runtime-Config Config-only-Probe vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssv53-runtime-config-probe-installer
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/azure-mower-migration

jobs:
  prepare:
    name: Config-only-Probe einbauen, testen und speichern
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sicherheitsgate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "Installer nur auf dem Default-Branch starten." >&2
            exit 1
          fi

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Migration-Branch laden
        id: worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          WORKTREE="$RUNNER_TEMP/runtime-config-probe"
          rm -rf "$WORKTREE"
          git worktree add --detach "$WORKTREE" "origin/$TARGET_BRANCH"
          echo "path=$WORKTREE" >> "$GITHUB_OUTPUT"

      - name: Sicheren Config-only-Probe einbauen
        shell: bash
        env:
          WORKTREE: ${{ steps.worktree.outputs.path }}
          CONTROLLER_B64: ""
          TESTS_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$CONTROLLER_B64" | base64 --decode > "$WORKTREE/mower/controller.py"
          printf '%s' "$TESTS_B64" | base64 --decode > "$WORKTREE/tests/test_mower_controller_phase2.py"

      - name: Sicherheitsprüfung des Patches
        shell: bash
        env:
          WORKTREE: ${{ steps.worktree.outputs.path }}
        run: |
          set -euo pipefail
          cd "$WORKTREE"

          python -m py_compile mower/controller.py tests/test_mower_controller_phase2.py

          grep -Fq '"probe": "config_only"' mower/controller.py
          grep -Fq '"ENABLE_LIVE_READS": "false"' tests/test_mower_controller_phase2.py
          grep -Fq 'self.assertFalse(live_called)' tests/test_mower_controller_phase2.py
          grep -Fq 'self.assertFalse(result.command_sent)' tests/test_mower_controller_phase2.py
          grep -Fq 'fail-closed' tests/test_mower_controller_phase2.py

          if grep -Eq 'FORCE_PARK|RESUME_SCHEDULE|/actions' mower/controller.py; then
            echo "Unerwarteter Geräte-Marker im Controller-Patch." >&2
            exit 1
          fi

          echo "Patch-Sicherheitsprüfung: GRÜN"

      - name: Abhängigkeiten installieren
        shell: bash
        env:
          WORKTREE: ${{ steps.worktree.outputs.path }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$WORKTREE/requirements.txt"

      - name: Gesamte Testsuite ausführen
        shell: bash
        env:
          WORKTREE: ${{ steps.worktree.outputs.path }}
        run: |
          set -euo pipefail
          cd "$WORKTREE"
          python -m compileall -q mower function_app.py scripts
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Änderungen auf Migration-Branch speichern
        shell: bash
        env:
          WORKTREE: ${{ steps.worktree.outputs.path }}
        run: |
          set -euo pipefail
          cd "$WORKTREE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mower/controller.py tests/test_mower_controller_phase2.py

          if git diff --cached --quiet; then
            echo "Config-only-Probe war bereits identisch vorhanden."
            exit 0
          fi

          git commit -m "Runtime-Config im DRY_RUN ohne Gerätezugriff prüfen"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Ergebnis
        shell: bash
        run: |
          {
            echo "# Runtime-Config Config-only-Probe"
            echo
            echo "- Migration-Branch aktualisiert: **ja**"
            echo "- Gesamte Testsuite: **bestanden**"
            echo "- CONTROL_MODE-Freigaben geändert: **nein**"
            echo "- Live Reads aktiviert: **nein**"
            echo "- Gerätebefehle ergänzt: **nein**"
            echo "- Neuer Probe: **Blob-Runtime-Config über Managed Identity**"
          } >> "$GITHUB_STEP_SUMMARY"
