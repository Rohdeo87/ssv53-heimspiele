name: SSV53 Bestell-Mail Shopdesign Upgrade V1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Exakt SSV53-ORDER-MAIL-SHOPDESIGN eingeben"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ssv53-order-mail-shopdesign-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: Shop-Mail sicher testen, deployen und Appack-Datei bauen
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      MIGRATION_BRANCH: feature/azure-mower-migration
      RESOURCE_GROUP: rg-ssv53-platzpflege-prod
      FUNCTION_APP: func-ssv53platzpflege-prod-q7kbw54s
      BACKEND_B64: 
      TESTS_B64: 
      APPACK_TEMPLATE_B64: 

    steps:
      - name: Freigabe und Branch prüfen
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          [ "$GITHUB_REF_NAME" = "$MIGRATION_BRANCH" ] || {
            echo "Dieser Workflow darf nur vom Azure-Migrationsbranch laufen." >&2
            exit 1
          }

          [ "$CONFIRMATION" = "SSV53-ORDER-MAIL-SHOPDESIGN" ] || {
            echo "Explizite Bestätigung fehlt." >&2
            exit 1
          }

      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ env.MIGRATION_BRANCH }}
          fetch-depth: 0

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Shop-Mail Backend und Tests einsetzen
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          backend = base64.b64decode(os.environ["BACKEND_B64"]).decode("utf-8")
          tests = base64.b64decode(os.environ["TESTS_B64"]).decode("utf-8")

          Path("order_mail.py").write_text(backend, encoding="utf-8")
          Path("tests/test_order_mail_details.py").write_text(tests, encoding="utf-8")

          required_backend_markers = [
              "PRODUCT_IMAGES",
              "APP_BLUE = \"#285EA7\"",
              "APP_GOLD = \"#E0AA3F\"",
              "Deine Bestellung",
              "Gesamtsumme",
              "ORDER_TOTAL_MISMATCH",
              "client_supplied",
          ]
          # "client_supplied" intentionally only exists in test, not backend.
          required_backend_markers.remove("client_supplied")

          missing = [m for m in required_backend_markers if m not in backend]
          if missing:
              raise SystemExit("Backend-Markierungen fehlen: " + ", ".join(missing))

          if "evil.example.invalid" not in tests:
              raise SystemExit("Sicherheitstest gegen fremde Bild-URLs fehlt.")

          print("Shop-Mail-Backend und zusätzliche Sicherheitstests wurden eingesetzt.")
          PY

      - name: Syntax und Bestell-Mail Tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile order_mail.py
          python -m unittest discover -s tests -p 'test_order_mail*.py' -v

      - name: Gesamte Python-Test-Suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: FULL_FAILSAFE Paket bauen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python scripts/build_azure_full_failsafe_package.py \
            --output dist/ssv53-platzpflege-full-failsafe-shopmail-v1.zip

          python - <<'PY'
          import json
          import zipfile

          path = "dist/ssv53-platzpflege-full-failsafe-shopmail-v1.zip"
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              for required in ("function_app.py", "order_mail.py", "package-manifest.json"):
                  if required not in names:
                      raise SystemExit(f"Deployment-Paket fehlt: {required}")

              backend = archive.read("order_mail.py").decode("utf-8")
              manifest = json.loads(archive.read("package-manifest.json").decode("utf-8"))

          for marker in (
              'APP_BLUE = "#285EA7"',
              'APP_GOLD = "#E0AA3F"',
              "PRODUCT_IMAGES",
              "ORDER_TOTAL_MISMATCH",
          ):
              if marker not in backend:
                  raise SystemExit(f"Shop-Mail-Markierung fehlt im ZIP: {marker}")

          if manifest.get("safety_stage") != "FULL_FAILSAFE_7_ZONES_90_MIN_CAPABLE_LOCKED":
              raise SystemExit("FULL_FAILSAFE Sicherheitsstufe wurde verändert.")

          print("FULL_FAILSAFE-Paket enthält die neue Shop-Mail bei unveränderter Sicherheitsstufe.")
          PY

      - name: Quellstand im Migrationsbranch sichern
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add order_mail.py tests/test_order_mail_details.py

          if git diff --cached --quiet; then
            echo "Quellstand ist bereits aktuell."
          else
            git commit -m "Add SSV53 shop-style order ready email"
            git push origin "HEAD:$MIGRATION_BRANCH"
          fi

      - name: Mit Azure per OIDC anmelden
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: FULL_FAILSAFE mit Shop-Mail deployen
        shell: bash
        run: |
          set -euo pipefail

          az functionapp deployment source config-zip \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --src dist/ssv53-platzpflege-full-failsafe-shopmail-v1.zip \
            --build-remote true \
            --timeout 900 \
            --output none

      - name: Funktionsschlüssel lesen
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_KEY="$(az functionapp function keys list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --function-name ssv53_order_mail \
            --query '"appack-order-admin"' \
            --output tsv)"

          [ -n "$FUNCTION_KEY" ] || {
            echo "Funktionsschlüssel appack-order-admin fehlt." >&2
            exit 1
          }

          echo "::add-mask::$FUNCTION_KEY"
          echo "FUNCTION_KEY=$FUNCTION_KEY" >> "$GITHUB_ENV"

      - name: Neuen Mail-Endpunkt ohne Versand prüfen
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          url = (
              f"https://{os.environ['FUNCTION_APP']}.azurewebsites.net/api/order-mail?"
              + urllib.parse.urlencode({"code": os.environ["FUNCTION_KEY"]})
          )

          last_error = None
          for attempt in range(1, 19):
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"action": "check"}).encode("utf-8"),
                  headers={"Content-Type": "text/plain;charset=UTF-8"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if payload.get("ok") is True and payload.get("smtpAuthenticated") is True:
                      print("Azure-Shop-Mail Endpoint ist erreichbar; SMTP ist authentifiziert.")
                      print("mailEnabled:", payload.get("mailEnabled"))
                      raise SystemExit(0)
                  last_error = payload
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  last_error = f"HTTP {exc.code}: {body[:500]}"
              except Exception as exc:
                  last_error = repr(exc)

              print(f"Endpoint noch nicht bereit ({attempt}/18).")
              time.sleep(10)

          raise SystemExit(f"Endpoint-Prüfung fehlgeschlagen: {last_error}")
          PY

      - name: Fertige Appack-Bestellverwaltung mit Key bauen
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          template = base64.b64decode(
              os.environ["APPACK_TEMPLATE_B64"]
          ).decode("utf-8")
          key = os.environ["FUNCTION_KEY"]
          placeholder = "__SSV53_ORDER_MAIL_FUNCTION_KEY__"

          if template.count(placeholder) != 1:
              raise SystemExit("Appack-Key-Platzhalter ist nicht exakt einmal vorhanden.")

          output = template.replace(placeholder, key)

          checks = {
              "Key eingesetzt": placeholder not in output,
              "No-Preflight bleibt aktiv": "Content-Type':'text/plain;charset=UTF-8" in output,
              "Positionen werden übergeben": "items:(o.data.items||[]).map" in output,
              "Gesamtsumme wird übergeben": "totalCents:Number(o.data.totalCents||0)" in output,
              "Keine Client-Bild-URL": "imageUrl:" not in output[output.find("function sendReadyMail"):output.find("function changeStatus")],
              "Mail-Audit bleibt aktiv": "pickupMailSentAt" in output and "pickupMailSentTo" in output,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Appack-Validierung fehlgeschlagen: " + ", ".join(failed))

          out = Path("out")
          out.mkdir(exist_ok=True)
          path = out / "DIESE_DATEI_IN_APPACK_EINSETZEN_V5_SHOPMAIL.txt"
          path.write_text(output, encoding="utf-8")

          for name in checks:
              print("OK:", name)
          print("Fertige Appack-Datei:", path.name)
          print("Der Funktionsschlüssel wird nicht ausgegeben.")
          PY

      - name: Fertige Appack-Datei bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: DIESE_DATEI_IN_APPACK_EINSETZEN_V5_SHOPMAIL
          path: out/DIESE_DATEI_IN_APPACK_EINSETZEN_V5_SHOPMAIL.txt
          if-no-files-found: error
          retention-days: 1

      - name: Ergebnis zusammenfassen
        shell: bash
        run: |
          {
            echo "# SSV53 Shop-Mail Upgrade"
            echo
            echo "- FULL_FAILSAFE Sicherheitsstufe: **unverändert**"
            echo "- SMTP-Prüfung: **erfolgreich, ohne E-Mail-Versand**"
            echo "- Neue Mail: **SSV53/App-Design mit Bestellpositionen und Gesamtsumme**"
            echo "- Appack-Artifact: **DIESE_DATEI_IN_APPACK_EINSETZEN_V5_SHOPMAIL**"
            echo
            echo "Nach dem Lauf die Artifact-Datei vollständig in die Appack-Bestellverwaltung einsetzen."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure-Sitzung beenden
        if: always()
        shell: bash
        run: az logout || true
