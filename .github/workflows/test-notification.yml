name: SSV53 Benachrichtigung testen

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dateien laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testbenachrichtigung als GitHub-Issue senden
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python notify_changes.py
          --repository "${{ github.repository }}"
          --run-url "$RUN_URL"
          --test
          --test-id "${{ github.run_id }}"
