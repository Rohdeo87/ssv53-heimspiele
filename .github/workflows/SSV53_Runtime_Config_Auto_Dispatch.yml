name: SSV53 Runtime-Config automatisch aktualisieren

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - public/summary.json
      - public/included_matches.json
      - public/quality_report.json
  schedule:
    - cron: "47 1,7,13,19 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: ssv53-runtime-config-auto-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Geprüften Wiederherstellungs-Publish anstoßen
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Runtime-Config-Workflow sicher starten
        uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "azure-runtime-config-rollout.yml",
              ref: "feature/azure-mower-migration",
              inputs: {
                operation: "publish",
                publish_confirmation: "SSV53-RUNTIME-CONFIG-PUBLISH",
                source_sha: process.env.SOURCE_SHA,
              },
            });

      - name: Ergebnis zusammenfassen
        shell: bash
        run: |
          {
            echo "# Runtime-Config-Aktualisierung angestoßen"
            echo
            echo "- Anlass: **${GITHUB_EVENT_NAME}**"
            echo "- Zielbranch: **feature/azure-mower-migration**"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "- Quelldaten: **exakter Commit ${GITHUB_SHA} des neuen Spielbestands**"
            else
              echo "- Quelldaten: **neuester freigegebener Stand aus main**"
            fi
            echo "- Altersgrenze der Quelldaten: **12 Stunden**"
            echo "- Azure-Betriebsmodus wird verändert: **nein**"
            echo "- Mäher-/Beregnungsbefehle: **keine**"
          } >> "$GITHUB_STEP_SUMMARY"
