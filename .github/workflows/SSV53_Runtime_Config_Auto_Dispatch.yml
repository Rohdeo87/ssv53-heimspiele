name: SSV53 Runtime-Config automatisch aktualisieren

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - SSV53 Heimspiele aktualisieren
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - public/summary.json
      - public/included_matches.json
      - public/quality_report.json
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: ssv53-runtime-config-auto-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Quellfrische und Kalender automatisch wiederherstellen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Commits made by the importer's GITHUB_TOKEN deliberately do not cause a
    # push-triggered workflow. A completed successful own-repository main
    # import is therefore an explicit, source-SHA-neutral hand-off. The
    # rollout reads the then-current atomic main publication itself.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           (github.event.workflow_run.event == 'schedule' ||
            github.event.workflow_run.event == 'workflow_dispatch' ||
            github.event.workflow_run.event == 'push') &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}

    steps:
      - name: Runtime-Config-Workflow sicher starten
        id: runtime_dispatch
        uses: actions/github-script@v8
        env:
          IMPORT_WORKFLOW_RUN: ${{ github.event_name == 'workflow_run' }}
          SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        with:
          script: |
            if (process.env.IMPORT_WORKFLOW_RUN === "true") {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              });
              const jobs = Array.isArray(data?.jobs) ? data.jobs : [];
              const update = jobs.find((job) => job?.name === "update" && job?.conclusion === "success");
              const steps = Array.isArray(update?.steps) ? update.steps : [];
              const succeeded = (name) => steps.some(
                (step) => step?.name === name && step?.conclusion === "success"
              );
              if (!succeeded("Heimspiele zurückhaltend abrufen") ||
                  !succeeded("Daten und Schutzstatus konfliktfrei speichern")) {
                core.setOutput("dispatched", "false");
                core.info("Der Importlauf hat keinen nachgewiesenen Datencommit; kein Runtime-Publish.");
                return;
              }
            }
            function recoveryDecision(age,hour) {
              if (!Number.isFinite(age) || age < -5 || !Number.isInteger(hour) || hour < 0 || hour > 23) throw new Error("Invalid freshness inputs");
              return age >= 360 && hour >= 6 && hour < 22 ? "refresh" : "verify";
            }
            const owner = context.repo.owner, repo = context.repo.repo;
            async function summary() {
              const {data} = await github.rest.repos.getContent({owner,repo,path:"public/summary.json",ref:"main"});
              const value = JSON.parse(Buffer.from(data.content,"base64").toString("utf8"));
              const age = (Date.now()-Date.parse(value.generated_at))/60000;
              if (!Number.isFinite(age) || age < -5) throw new Error("Ungültiger Abrufzeitpunkt");
              return {value,age};
            }
            async function runAndWait(workflow_id,ref,inputs) {
              const prior = await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id,branch:ref,event:"workflow_dispatch",per_page:1});
              const before = prior.data.workflow_runs[0]?.id || 0;
              await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id,ref,inputs});
              for (let i=0;i<45;i++) {
                await new Promise(resolve=>setTimeout(resolve,20000));
                const {data} = await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id,branch:ref,event:"workflow_dispatch",per_page:10});
                const run = data.workflow_runs.filter(r=>r.id>before).sort((a,b)=>a.id-b.id)[0];
                if (run?.status === "completed") {
                  if (run.conclusion !== "success") throw new Error(`${workflow_id} fehlgeschlagen: ${run.html_url}`);
                  return;
                }
              }
              throw new Error(`${workflow_id}: Abschluss nicht bestätigt`);
            }
            // Verify the public read-only calendar instead of treating a queued
            // dispatch as proof of a successful publication.
            async function calendarHealthy(sourceStamp) {
              try {
                const response = await fetch("https://func-ssv53platzpflege-prod-q7kbw54s.azurewebsites.net/api/occupancy",{signal:AbortSignal.timeout(30000)});
                if (!response.ok) return false;
                const data = await response.json();
                return data.match_source_fresh === true && data.training_calendar?.fail_closed === false &&
                  Date.parse(data.match_source_generated_at_utc) >= Date.parse(sourceStamp);
              } catch (_) { return false; }
            }
            let current = await summary();
            const hour = Number(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Berlin",hour:"2-digit",hourCycle:"h23"}).format(new Date()));
            const decision = recoveryDecision(current.age,hour);
            if (decision === "refresh") {
              core.info("Quellbestand mindestens sechs Stunden alt: geprüften Import vorziehen.");
              await runAndWait("update-matches.yml","main",{skip_start_delay:"true",allow_destructive_change:"false",persist_test_results:"false"});
              current = await summary();
            }
            if (current.age > 720) throw new Error("Quellbestand weiterhin älter als 12 Stunden; keine Freigabe alter Daten.");
            if (await calendarHealthy(current.value.generated_at)) {
              core.setOutput("dispatched","false");
              core.info("Aktueller veröffentlichter Kalender ist erreichbar und geprüft.");
              return;
            }
            await runAndWait("azure-runtime-config-rollout.yml","feature/azure-mower-migration",{
              operation:"publish",publish_confirmation:"SSV53-RUNTIME-CONFIG-PUBLISH",source_sha:""
            });
            for (let i=0;i<3;i++) {
              if (await calendarHealthy(current.value.generated_at)) {
                core.setOutput("dispatched","true");
                core.info("Import, Veröffentlichung und öffentlicher Kalender erfolgreich geprüft.");
                return;
              }
              await new Promise(resolve=>setTimeout(resolve,20000));
            }
            throw new Error("Veröffentlichung beendet, aber Kalender weiterhin nicht fehlerfrei erreichbar.");

      - name: Ergebnis zusammenfassen
        if: >-
          ${{ github.event_name != 'workflow_run' ||
              steps.runtime_dispatch.outputs.dispatched == 'true' }}
        shell: bash
        run: |
          {
            echo "# Runtime-Config-Aktualisierung geprüft"
            echo
            echo "- Anlass: **${GITHUB_EVENT_NAME}**"
            echo "- Zielbranch: **feature/azure-mower-migration**"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "- Quelldaten: **neuester atomar veröffentlichter main-Stand**"
            elif [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
              echo "- Quelldaten: **neuster atomar veröffentlichter main-Stand nach erfolgreichem Import**"
            else
              echo "- Quelldaten: **neuester freigegebener Stand aus main**"
            fi
            echo "- Altersgrenze der Quelldaten: **12 Stunden**"
            echo "- Azure-Betriebsmodus wird verändert: **nein**"
            echo "- Mäher-/Beregnungsbefehle: **keine**"
          } >> "$GITHUB_STEP_SUMMARY"
