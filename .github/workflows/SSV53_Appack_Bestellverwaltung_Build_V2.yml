name: SSV53 Appack Bestellverwaltung Azure-Mail bauen V2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Exakt SSV53-APPACK-ORDER-MAIL-BUILD-V2 eingeben"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Fertige Appack-Datei mit Azure-Key erzeugen
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MIGRATION_BRANCH: feature/azure-mower-migration
      RESOURCE_GROUP: rg-ssv53-platzpflege-prod
      FUNCTION_APP: func-ssv53platzpflege-prod-q7kbw54s
      TEMPLATE_B64: 

    steps:
      - name: Freigabe prüfen
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "$MIGRATION_BRANCH" ] || {
            echo "Workflow muss vom Azure-Migrationsbranch gestartet werden." >&2
            exit 1
          }
          [ "$CONFIRMATION" = "SSV53-APPACK-ORDER-MAIL-BUILD-V2" ] || {
            echo "Explizite Bestätigung fehlt." >&2
            exit 1
          }

      - name: Mit Azure per OIDC anmelden
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fertige Datei erzeugen und hart validieren
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_KEY="$(az functionapp function keys list             --resource-group "$RESOURCE_GROUP"             --name "$FUNCTION_APP"             --function-name ssv53_order_mail             --query '"appack-order-admin"'             --output tsv)"

          [ -n "$FUNCTION_KEY" ] || {
            echo "Funktionsschlüssel appack-order-admin fehlt." >&2
            exit 1
          }

          echo "::add-mask::$FUNCTION_KEY"
          export FUNCTION_KEY

          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          template = base64.b64decode(os.environ["TEMPLATE_B64"]).decode("utf-8")
          key = os.environ["FUNCTION_KEY"]
          placeholder = "__SSV53_ORDER_MAIL_FUNCTION_KEY__"

          if template.count(placeholder) != 1:
              raise SystemExit("Template enthält den Key-Platzhalter nicht exakt einmal.")

          output = template.replace(placeholder, key)

          # Harte Validierung: Eine Datei mit Platzhalter darf niemals als Artifact erscheinen.
          if placeholder in output:
              raise SystemExit("FEHLER: Platzhalter ist noch in der Ausgabedatei.")
          if f'const ORDER_MAIL_FUNCTION_KEY="{key}"' not in output:
              raise SystemExit("FEHLER: Azure-Key wurde nicht korrekt in die JS-Konfiguration eingesetzt.")
          if "sendReadyMail(o)" not in output:
              raise SystemExit("FEHLER: Mailintegration fehlt.")
          if "pickupMailSentAt" not in output:
              raise SystemExit("FEHLER: Mail-Auditfeld fehlt.")

          out = Path("out")
          out.mkdir(exist_ok=True)

          filename = out / "DIESE_DATEI_IN_APPACK_EINSETZEN_SSV53_Bestellverwaltung_AzureMail.txt"
          filename.write_text(output, encoding="utf-8")

          # Nur harmlose Validierungsinformationen ausgeben – niemals den Key.
          print("OK: Azure-Key wurde in die Appack-Datei eingesetzt.")
          print("OK: Platzhalter ist vollständig entfernt.")
          print("OK: Mailintegration und Auditfelder sind vorhanden.")
          print("Datei:", filename.name)
          PY

          unset FUNCTION_KEY

      - name: Fertige Datei hochladen
        uses: actions/upload-artifact@v7
        with:
          name: DIESE_DATEI_IN_APPACK_EINSETZEN
          path: out/DIESE_DATEI_IN_APPACK_EINSETZEN_SSV53_Bestellverwaltung_AzureMail.txt
          if-no-files-found: error
          retention-days: 1

      - name: Azure-Sitzung beenden
        if: always()
        shell: bash
        run: az logout || true
