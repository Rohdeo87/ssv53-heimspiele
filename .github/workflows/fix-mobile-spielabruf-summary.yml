name: "Einmalig: Spielabruf-Summary bereinigen"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: ssv53-summary-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TARGET_BRANCH: feature/mobile-spielabruf-report-v1
      TARGET_PR: "1"

    steps:
      - name: Automatisierungstoken prüfen
        shell: bash
        env:
          AUTOMATION_TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "Das Repository-Secret SSV53_AUTOMATION_TOKEN fehlt."
            exit 1
          fi

      - name: Test-Branch laden
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}

      - name: Testausgabe aus der echten Actions-Summary entfernen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          payload = ""
          path = Path("tests/test_change_report.py")
          path.write_bytes(base64.b64decode(payload))
          print(f"Aktualisiert: {path}")
          PY

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Vollständige Tests ausführen
        env:
          GITHUB_STEP_SUMMARY: ""
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q .

      - name: Korrektur committen und pushen
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_change_report.py

          if git diff --cached --quiet; then
            echo "Keine Korrektur mehr erforderlich."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Testausgabe aus Actions-Summary fernhalten"
            git push origin "HEAD:$TARGET_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pull-Request-Tests abwarten
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          HEAD_SHA: ${{ steps.push.outputs.head_sha }}
        run: |
          set -euo pipefail

          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list               --workflow "SSV53 Code prüfen"               --branch "$TARGET_BRANCH"               --event pull_request               --json databaseId,headSha,status,conclusion               --jq '.[] | select(.headSha == env.HEAD_SHA) | .databaseId'               --limit 20 | head -n 1)"

            if [ -n "$RUN_ID" ]; then
              break
            fi
            echo "Warte auf den automatisch gestarteten Pull-Request-Test ($attempt/30) ..."
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Der Pull-Request-Test wurde nicht rechtzeitig gefunden."
            exit 1
          fi

          echo "PR-Testlauf: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Neuen echten Testabruf starten
        id: live_test
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail

          BEFORE_ID="$(gh run list --workflow "SSV53 Heimspiele aktualisieren" --branch "$TARGET_BRANCH" --event workflow_dispatch --json databaseId --limit 1 --jq '.[0].databaseId // 0')"

          gh workflow run update-matches.yml --ref "$TARGET_BRANCH" -f skip_start_delay=true -f allow_destructive_change=false -f persist_test_results=false

          RUN_ID=""
          for attempt in $(seq 1 30); do
            CANDIDATE_ID="$(gh run list --workflow "SSV53 Heimspiele aktualisieren" --branch "$TARGET_BRANCH" --event workflow_dispatch --json databaseId --limit 1 --jq '.[0].databaseId // 0')"

            if [ "$CANDIDATE_ID" != "0" ] && [ "$CANDIDATE_ID" != "$BEFORE_ID" ]; then
              RUN_ID="$CANDIDATE_ID"
              break
            fi

            echo "Warte auf den echten Testabruf ($attempt/30) ..."
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Der echte Testabruf wurde nicht rechtzeitig gefunden."
            exit 1
          fi

          echo "Echter Testabruf: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Pull Request dokumentieren
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          PR_TEST_RUN: ${{ steps.ci.outputs.run_id }}
          LIVE_TEST_RUN: ${{ steps.live_test.outputs.run_id }}
        run: |
          cat > /tmp/comment.md <<EOF
          ✅ Die künstliche Testausgabe wurde aus der Actions-Summary entfernt.

          Erfolgreich geprüft:
          - vollständige Python-Tests und Kompilierungsprüfung
          - Pull-Request-Test: https://github.com/${{ github.repository }}/actions/runs/$PR_TEST_RUN
          - echter Spielabruf auf dem Test-Branch: https://github.com/${{ github.repository }}/actions/runs/$LIVE_TEST_RUN

          Der Pull Request bleibt bis zur ausdrücklichen Freigabe als Draft geöffnet.
          EOF

          gh pr comment "$TARGET_PR" --body-file /tmp/comment.md

      - name: Ergebnis zusammenfassen
        if: always()
        shell: bash
        run: |
          {
            echo "## Korrektur des mobilen Spielabrufs"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Korrektur erfolgreich eingespielt und vollständig getestet."
              echo ""
              echo "- Pull Request: #$TARGET_PR"
              echo "- Branch: \`$TARGET_BRANCH\`"
              echo "- Die künstliche E2-Testausgabe erscheint künftig nicht mehr in echten Abruf-Summaries."
              echo "- Ein neuer echter Testabruf wurde automatisch erfolgreich ausgeführt."
              echo "- \`main\` wurde nicht verändert."
              echo ""
              echo "**Nächster Schritt:** Freigabe zum Merge des Pull Requests."
            else
              echo "❌ Die Korrektur oder einer der automatischen Tests ist fehlgeschlagen."
              echo "- \`main\` wurde nicht verändert."
              echo "- Der Pull Request bleibt offen und ungemergt."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Einmaligen Korrektur-Workflow wieder entfernen
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SELF_PATH=".github/workflows/fix-mobile-spielabruf-summary.yml"

          git fetch origin main
          git checkout -B main origin/main

          if [ -f "$SELF_PATH" ]; then
            rm "$SELF_PATH"
            git add "$SELF_PATH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Einmaligen Summary-Korrekturworkflow entfernen"
            git push origin main
          fi
