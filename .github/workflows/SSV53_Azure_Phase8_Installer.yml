name: "Einmalig: Azure Phase 8 Bootstrap-Preflight vorbereiten"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssv53-azure-phase8-preflight-installer
  cancel-in-progress: false

jobs:
  prepare:
    name: Bootstrap-Preflight vorbereiten
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Migrationsbranch laden
        uses: actions/checkout@v7
        with:
          ref: feature/azure-mower-migration
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Preflight-Workflow im Migrationsbranch anlegen
        shell: bash
        env:
          PREFLIGHT_B64: ""
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          printf '%s' "$PREFLIGHT_B64" | base64 -d > .github/workflows/azure-bootstrap-preflight.yml

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/azure-bootstrap-preflight.yml
          if git diff --cached --quiet; then
            echo "Bootstrap-Preflight bereits vorhanden."
          else
            git commit -m "Azure Phase 8: Bootstrap-Preflight vorbereiten"
            git push origin feature/azure-mower-migration
          fi

      - name: Main laden
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Sicheren Platzhalter auf main anlegen
        shell: bash
        env:
          STUB_B64: ""
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          printf '%s' "$STUB_B64" | base64 -d > .github/workflows/azure-bootstrap-preflight.yml

          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/azure-bootstrap-preflight.yml
          if git diff --cached --quiet; then
            echo "Main-Platzhalter bereits vorhanden."
          else
            git commit -m "Sicheren Azure-Bootstrap-Preflight-Platzhalter ergänzen"
            git push origin main
          fi

  cleanup:
    name: Einmaligen Phase-8-Installer entfernen
    needs: prepare
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Main laden
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Installer entfernen
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/SSV53_Azure_Phase8_Installer.yml"
          git config user.name "SSV53 Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f "$FILE"
          if git diff --quiet; then
            echo "Installer bereits entfernt."
          else
            git add -A "$FILE"
            git commit -m "Einmaligen Azure-Phase-8-Installer entfernen"
            git push origin main
          fi
