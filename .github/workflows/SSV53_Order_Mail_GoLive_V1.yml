name: SSV53 Bestell-Mail Go-Live V1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Exakt SSV53-ORDER-MAIL-GO-LIVE eingeben"
        required: true
        type: string
      appack_page_installed:
        description: "Exakt APPACK-SEITE-INSTALLIERT eingeben"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  enable:
    if: inputs.confirmation == 'SSV53-ORDER-MAIL-GO-LIVE'
    name: Produktiven Abhol-Mailversand freigeben
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MIGRATION_BRANCH: feature/azure-mower-migration
      RESOURCE_GROUP: rg-ssv53-platzpflege-prod
      FUNCTION_APP: func-ssv53platzpflege-prod-q7kbw54s

    steps:
      - name: Doppelte Freigabe prüfen
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          APPACK_CONFIRMATION: ${{ inputs.appack_page_installed }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "$MIGRATION_BRANCH" ] || {
            echo "Workflow muss vom Azure-Migrationsbranch gestartet werden." >&2
            exit 1
          }
          [ "$CONFIRMATION" = "SSV53-ORDER-MAIL-GO-LIVE" ] || {
            echo "Go-Live-Bestätigung fehlt." >&2
            exit 1
          }
          [ "$APPACK_CONFIRMATION" = "APPACK-SEITE-INSTALLIERT" ] || {
            echo "Bestätigung der installierten Appack-Seite fehlt." >&2
            exit 1
          }

      - name: Mit Azure per OIDC anmelden
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: SMTP vor Go-Live erneut prüfen
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_KEY="$(az functionapp function keys list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --function-name ssv53_order_mail \
            --query '"appack-order-admin"' \
            --output tsv)"

          [ -n "$FUNCTION_KEY" ] || {
            echo "Funktionsschlüssel fehlt." >&2
            exit 1
          }

          echo "::add-mask::$FUNCTION_KEY"
          export FUNCTION_KEY

          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          url = (
              f"https://{os.environ['FUNCTION_APP']}.azurewebsites.net/api/order-mail?"
              + urllib.parse.urlencode({"code": os.environ["FUNCTION_KEY"]})
          )
          request = urllib.request.Request(
              url,
              data=json.dumps({"action": "check"}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
          if payload.get("ok") is not True or payload.get("smtpAuthenticated") is not True:
              raise SystemExit(f"SMTP-Prüfung fehlgeschlagen: {payload}")
          print("SMTP ist vor Go-Live erfolgreich authentifiziert.")
          PY

      - name: Produktiven Abhol-Mailversand aktivieren
        shell: bash
        run: |
          set -euo pipefail

          az functionapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --settings SSV53_ORDER_MAIL_ENABLED=true \
            --output none

          echo "SSV53_ORDER_MAIL_ENABLED wurde auf true gesetzt."

      - name: Aktivierung verifizieren
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 12); do
            ENABLED="$(az functionapp config appsettings list \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --query "[?name=='SSV53_ORDER_MAIL_ENABLED'].value | [0]" \
              --output tsv 2>/dev/null || true)"

            if [ "$ENABLED" = "true" ]; then
              echo "Verifiziert: Produktiver Bestell-Mailversand ist aktiviert."
              exit 0
            fi
            sleep 5
          done

          echo "Aktivierung konnte nicht verifiziert werden." >&2
          exit 1

      - name: Azure-Sitzung beenden
        if: always()
        shell: bash
        run: az logout || true

  reservation_notifications:
    if: inputs.confirmation == 'SSV53-RESERVATION-NOTIFICATIONS'
    name: Neue Vormerkungen sicher an Besteller und Geschäftsstelle melden
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ssv53-reservation-notifications
      cancel-in-progress: false
    steps:
      - name: Auftragsumfang prüfen
        env:
          REF_NAME: ${{ github.ref_name }}
          CONFIRMATION: ${{ inputs.confirmation }}
          APPACK_CONFIRMATION: ${{ inputs.appack_page_installed }}
        run: |
          test "$REF_NAME" = "feature/azure-mower-migration"
          test "$CONFIRMATION" = "SSV53-RESERVATION-NOTIFICATIONS"
          test "$APPACK_CONFIRMATION" = "SERVER-FIRST"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Abhängigkeiten und isolierte Mailtests
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest -q tests/test_reservation_notifications.py tests/test_reservation_notifications_deploy.py tests/test_order_mail.py tests/test_order_mail_details.py tests/test_azure_package.py tests/test_full_failsafe_package.py
      - name: Mit vorhandener Azure-Deployment-Identität anmelden
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Nur Mailmodul und Registrierung im aktiven Stand ergänzen
        run: python scripts/deploy_reservation_notifications.py

  customer_mail_templates:
    if: inputs.confirmation == 'SSV53-CUSTOMER-MAIL-TEMPLATES'
    name: Kundenmails mit gemeinsamem Layout und Geschäftsstelle aktualisieren
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ssv53-reservation-notifications
      cancel-in-progress: false
    steps:
      - name: Auftrag und Ziel prüfen
        env:
          REF_NAME: ${{ github.ref_name }}
          APPACK_CONFIRMATION: ${{ inputs.appack_page_installed }}
        run: |
          test "$REF_NAME" = "feature/azure-mower-migration"
          test "$APPACK_CONFIRMATION" = "PRESERVE-ACTIVATION"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Mailvorlagen, Versandverhalten und Paketbestand testen
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest -q tests/test_customer_mail_layout.py tests/test_customer_mail_deploy.py tests/test_reservation_notifications.py tests/test_reservation_notifications_deploy.py tests/test_order_mail.py tests/test_order_mail_details.py tests/test_azure_package.py tests/test_full_failsafe_package.py tests/test_full_mower_package.py tests/test_park_only_package.py
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Nur Mailrenderer und Icons im aktiven Paket ersetzen
        run: python scripts/deploy_customer_mail_templates.py

  mower_service:
    if: inputs.confirmation == 'SSV53-MOWER-SERVICE-INSPECT' || inputs.confirmation == 'SSV53-MOWER-SERVICE-RELEASE' || inputs.confirmation == 'SSV53-MOWER-SERVICE-STATE' || inputs.confirmation == 'SSV53-MOWER-SERVICE-VERIFY'
    name: Mäher-Wartung im bestehenden Live-Paket prüfen oder ergänzen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ${{ inputs.confirmation == 'SSV53-MOWER-SERVICE-STATE' && 'ssv53-mower-service-state-read' || 'ssv53-reservation-notifications' }}
      cancel-in-progress: false
    steps:
      - name: Ziel und Umfang prüfen
        env:
          REF_NAME: ${{ github.ref_name }}
          PRESERVE_CONFIRMATION: ${{ inputs.appack_page_installed }}
        run: |
          test "$REF_NAME" = "feature/azure-mower-migration"
          test "$PRESERVE_CONFIRMATION" = "PRESERVE-LIVE-STATE"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Steuerung, Sicherheit und Paketbestand prüfen
        run: |
          python -m pip install -r requirements-test.txt
          if [ "${{ inputs.confirmation }}" = "SSV53-MOWER-SERVICE-RELEASE" ]; then
            python -m pytest -q
            node --test tests/test_appack*.js
            python scripts/sync_platzpflege_design.py --check
          elif [ "${{ inputs.confirmation }}" = "SSV53-MOWER-SERVICE-VERIFY" ]; then
            python -m pytest -q tests/test_mower_service_deploy.py tests/test_mower_service_cms_merge.py tests/test_mower_service_mode.py
            node --test tests/test_appack*.js
            python scripts/sync_platzpflege_design.py --check
          fi
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Aktives Paket lesen und bei Auftrag gezielt ergänzen
        env:
          RELEASE_KIND: ${{ inputs.confirmation }}
        run: |
          if [ "$RELEASE_KIND" = "SSV53-MOWER-SERVICE-RELEASE" ]; then
            python scripts/deploy_mower_service.py --deploy --proof "$RUNNER_TEMP/mower-service-proof.json"
          elif [ "$RELEASE_KIND" = "SSV53-MOWER-SERVICE-STATE" ]; then
            python scripts/deploy_mower_service.py --state-only --proof "$RUNNER_TEMP/mower-service-proof.json"
          elif [ "$RELEASE_KIND" = "SSV53-MOWER-SERVICE-VERIFY" ]; then
            python scripts/deploy_mower_service.py --verify-installed --proof "$RUNNER_TEMP/mower-service-proof.json"
          else
            python scripts/deploy_mower_service.py --proof "$RUNNER_TEMP/mower-service-proof.json"
          fi
      - name: Nur den bereinigten Prüfbeleg aufbewahren
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mower-service-proof
          path: ${{ runner.temp }}/mower-service-proof.json
          if-no-files-found: ignore
          retention-days: 14
