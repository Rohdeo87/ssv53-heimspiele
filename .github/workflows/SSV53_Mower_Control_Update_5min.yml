name: "Einmalig: Mähersteuerung auf 5-Minuten-Stand aktualisieren"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssv53-mower-control-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_PATH: .github/workflows/mower-decision.yml
      SELF_PATH: .github/workflows/SSV53_Mower_Control_Update_5min.yml

    steps:
      - name: Wartungstoken prüfen
        shell: bash
        env:
          TOKEN: ${{ secrets.SSV53_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || {
            echo "SSV53_AUTOMATION_TOKEN fehlt." >&2
            exit 1
          }

      - name: main laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SSV53_AUTOMATION_TOKEN }}

      - name: Finale Mähersteuerung schreiben
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          encoded = ""
          target = Path(".github/workflows/mower-decision.yml")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(base64.b64decode(encoded))
          print(f"Aktualisiert: {target}")
          PY

      - name: Zielworkflow vollständig prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "PyYAML==6.0.2"

          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          path = Path(".github/workflows/mower-decision.yml")
          text = path.read_text(encoding="utf-8")
          parsed = yaml.safe_load(text)
          on_key = "on" if "on" in parsed else True

          assert parsed["name"] == "SSV53 Mähentscheidung und sicheres Parken"
          assert parsed[on_key]["schedule"][0]["cron"] == "*/5 * * * *"
          assert "actions/checkout@v6" in text
          assert "actions/setup-python@v6" in text
          assert "actions/upload-artifact@v7" in text
          assert "PARK_LOOKAHEAD_MINUTES = 15" in text
          assert "StartInWorkArea" not in text
          assert "ResumeSchedule" not in text
          assert "/calendar" not in text
          assert "/settings" not in text

          match = re.search(
              r"python - <<'PY'\n(.*?)\n          PY",
              text,
              flags=re.S,
          )
          assert match, "Eingebetteter Python-Code fehlt."
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in match.group(1).splitlines()
          )
          compile(code, "mower-decision.py", "exec")
          assert code.count('method="POST"') == 2
          assert '{"data": {"type": "ParkUntilFurtherNotice"}}' in code
          PY

      - name: Einmal-Aktualisierer entfernen und Änderungen speichern
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$SELF_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_PATH" "$SELF_PATH"

          if git diff --cached --quiet; then
            echo "Der Zielworkflow ist bereits aktuell."
          else
            git commit -m "Mähersteuerung auf sicheren 5-Minuten-Stand aktualisieren"
            git push origin HEAD:main
          fi

      - name: Zusammenfassung
        if: always()
        shell: bash
        run: |
          {
            echo "## Aktualisierung der Mähersteuerung"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Die Mähersteuerung wurde aktualisiert."
              echo ""
              echo "- Prüfung alle 5 Minuten"
              echo "- 15 Minuten Sicherheitsvorlauf vor Sperren"
              echo "- Node-24-kompatible GitHub Actions"
              echo "- einziger Steuerbefehl: ParkUntilFurtherNotice"
              echo "- automatischer Start weiterhin nicht implementiert"
              echo "- Einmal-Aktualisierer aus dem Repository entfernt"
            else
              echo "❌ Aktualisierung fehlgeschlagen; main wurde nicht verändert."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
